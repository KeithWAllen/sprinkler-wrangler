function sbErr(e){const m=(e&&e.message)||String(e||"");const c=(e&&e.code)||"";
  return {code:/quota|exceed|too large|payload/i.test(m)?"quota_exceeded":(c==="42501"||/row-level|permission|not allowed/i.test(m))?"invalid_argument":"unavailable",message:m}}
function dataUrlToBlob(u){const [h,b]=u.split(",");const mime=(h.match(/data:([^;]+)/)||[])[1]||"image/jpeg";const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
function blobToDataUrl(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)})}
function makeSupaDb(){
  const BUCKET="photos";
  const snap=(id,data)=>({id,exists:data!=null,data:()=>data==null?undefined:data,metadata:{fromCache:false,hasPendingWrites:false}});
  async function up(path,url){const {error}=await sb.storage.from(BUCKET).upload(path,dataUrlToBlob(url),{upsert:true,contentType:"image/jpeg"});if(error)throw sbErr(error)}
  async function down(path){const {data,error}=await sb.storage.from(BUCKET).download(path);if(error||!data)return null;return await blobToDataUrl(data)}
  const custOf=j=>({customer_email:String((j.info||{}).email||"").trim().toLowerCase()||null,customer_name:(j.info||{}).customer||null,address:[(j.info||{}).address,(j.info||{}).city].filter(Boolean).join(", ")||null});
  const lastEmail={};
  async function afterJobSave(id,j){
    const c=custOf(j);
    if(lastEmail[id]!==undefined&&lastEmail[id]!==c.customer_email){await sb.from("reports").update({customer_email:c.customer_email,customer_name:c.customer_name,address:c.address}).eq("job_id",id)}
    lastEmail[id]=c.customer_email;
    if(j.inv&&j.inv.no){const e=invoiceEstimate(j);
      const {error}=await sb.from("invoices").upsert(Object.assign({job_id:id,no:j.inv.no,kind:j.inv.kind||"estimate",status:j.inv.kind==="invoice"?(j.inv.status||"unpaid"):"estimate",total:e.total,html:invoiceHtml(j),updated_at:new Date().toISOString()},c));
      if(error)throw sbErr(error)}
  }
  function doc(path){const [col,id]=path.split("/");
    return {id,path,
      async get(){
        if(col==="jobs"){const {data,error}=await sb.from("jobs").select("data").eq("id",id).maybeSingle();if(error)throw sbErr(error);return snap(id,data&&data.data)}
        if(col==="settings"){const {data,error}=await sb.from("settings").select("data").eq("key",id).maybeSingle();if(error)throw sbErr(error);return snap(id,data&&data.data)}
        if(col==="jobmedia"){const img=await down("bg/"+id+".jpg");return snap(id,img?{img}:null)}
        if(col==="photos"){const img=await down("ph/"+id+".jpg");return snap(id,img?{img}:null)}
        if(col==="revisions"){const {data,error}=await sb.from("reports").select("html").eq("id",id).maybeSingle();if(error)throw sbErr(error);return snap(id,data?{html:data.html}:null)}
        return snap(id,null);
      },
      async set(d){
        if(col==="jobs"){const {error}=await sb.from("jobs").upsert(Object.assign({id,data:d,updated_at:new Date().toISOString()},{customer_email:custOf(d).customer_email}));if(error)throw sbErr(error);try{await afterJobSave(id,d)}catch(e){console.warn("invoice sync",e)}return}
        if(col==="settings"){const {error}=await sb.from("settings").upsert({key:id,data:d,updated_at:new Date().toISOString()});if(error)throw sbErr(error);return}
        if(col==="jobmedia")return up("bg/"+id+".jpg",d.img);
        if(col==="photos")return up("ph/"+id+".jpg",d.img);
        if(col==="revisions"){const j=S.jobs[d.job]||{info:{},revs:[]};const r=(j.revs||[]).find(x=>x.n===d.n)||{};
          const html=await inlinePhotos(d.html);
          const {error}=await sb.from("reports").upsert(Object.assign({id,job_id:d.job,rev:d.n,html,total:r.total||0,issued_at:new Date(r.at||Date.now()).toISOString(),issued_by:r.by||""},custOf(j)));
          if(error)throw sbErr(error);return}
      },
      async delete(){
        if(col==="jobs"){await sb.from("invoices").delete().eq("job_id",id);await sb.from("reports").delete().eq("job_id",id);const {error}=await sb.from("jobs").delete().eq("id",id);if(error)throw sbErr(error);return}
        if(col==="jobmedia"){await sb.storage.from(BUCKET).remove(["bg/"+id+".jpg"]);return}
        if(col==="photos"){await sb.storage.from(BUCKET).remove(["ph/"+id+".jpg"]);return}
      },
      onSnapshot(next,err){
        let alive=true;const deliver=async()=>{try{const s=await doc(path).get();if(alive)next(s)}catch(e){if(alive&&err)err(e)}};
        deliver();
        const ch=sb.channel("doc-"+path.replace(/[^a-z0-9]/gi,"-")).on("postgres_changes",{event:"*",schema:"public",table:col,filter:(col==="settings"?"key":"id")+"=eq."+id},()=>deliver()).subscribe();
        return ()=>{alive=false;sb.removeChannel(ch)};
      }
    }}
  function collection(name){return {
    doc:id=>doc(name+"/"+id),
    onSnapshot(next,err){
      let alive=true;const known=new Set();
      const mk=(type,id,data)=>({type,doc:snap(id,data),oldIndex:-1,newIndex:-1});
      (async()=>{
        const {data,error}=await sb.from(name).select("id,data");
        if(!alive)return;if(error){if(err)err(sbErr(error));return}
        const ch=(data||[]).map(r=>{known.add(r.id);return mk("added",r.id,r.data)});
        next({docs:[],size:ch.length,empty:!ch.length,docChanges:()=>ch,metadata:{fromCache:false,hasPendingWrites:false}});
      })();
      const channel=sb.channel("col-"+name).on("postgres_changes",{event:"*",schema:"public",table:name},p=>{
        if(!alive)return;let c;
        if(p.eventType==="DELETE"){const id=(p.old||{}).id;if(!id)return;known.delete(id);c=mk("removed",id,null)}
        else{const id=p.new.id;c=mk(known.has(id)?"modified":"added",id,p.new.data);known.add(id)}
        next({docs:[],size:1,empty:false,docChanges:()=>[c],metadata:{fromCache:false,hasPendingWrites:false}});
      }).subscribe();
      return ()=>{alive=false;sb.removeChannel(channel)};
    }}}
  return {doc,collection};
}

/* ---------- start the synced app once a technician is signed in ---------- */
function startDb(d){
  db=d;S.mode="db";S.loaded=false;
  db.collection("jobs").onSnapshot(snap=>{
    if(S.training)return;
    let changedCur=false;
    for(const ch of snap.docChanges()){
      const id=ch.doc.id;
      if(ch.type==="removed"){delete S.jobs[id];if(id===S.cur)changedCur=true;continue}
      if(saving[id]||dirty[id])continue;
      const data=ch.doc.data();const prev=S.jobs[id];
      if(prev&&prev.updatedAt>=data.updatedAt&&ch.type!=="added")continue;
      S.jobs[id]=normalizeJob(JSON.parse(JSON.stringify(data)));
      if(id===S.cur&&prev)changedCur=true;
    }
    S.loaded=true;
    const ae=document.activeElement;
    if(changedCur&&ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
    if(ME.open)return;
    render();
  },()=>toast("Lost connection to saved jobs. Check your signal."));
  db.doc("settings/pricing").onSnapshot(s=>{if(s.exists&&!pTimer){S.pricing=Object.assign({},(s.data()||{}).prices||{});if(S.home==="prices"&&!S.cur)renderKeepFocus()}},()=>{});
  setTimeout(()=>{if(!S.loaded){S.loaded=true;render()}},8000);
  render();
}

function authMsg(e){const m=(e&&e.message)||"";
  if(/invalid login/i.test(m))return "That email and password don't match. Try again, or reset your password.";
  if(/not confirmed/i.test(m))return "confirm";
  if(/already registered|already been registered/i.test(m))return "An account with that email already exists. Sign in instead.";
  if(/expired|invalid.*(otp|token)|token.*invalid/i.test(m))return "That code is wrong or has expired. Check the newest email or send a new code.";
  if(/rate|seconds|too many/i.test(m))return "Please wait a minute before asking for another code.";
  if(/password/i.test(m)&&/(short|least|weak)/i.test(m))return "Choose a password with at least 8 characters.";
  if(/fetch|network/i.test(m))return "Can't reach the server. Check your signal and try again.";
  return m||"Something went wrong. Try again.";
}
async function authSubmit(kind){
  const a=S.auth;const v=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
  const go=(patch)=>{Object.assign(a,{busy:false},patch);render();const f=document.querySelector(".authf input:not([value]),.authf input[value='']");if(f)f.focus()};

  try{
    if(kind==="signin"){const pw=(document.getElementById("au-pass")||{}).value||"";a.email=v("au-email").toLowerCase();render();
      const {data,error}=await sb.auth.signInWithPassword({email:a.email,password:pw});
      if(error){const m=authMsg(error);if(m==="confirm"){await sb.auth.resend({type:"signup",email:a.email});return go({step:"code",msg:"Your email isn't confirmed yet. We sent you a new code."})}return go({err:m})}
      a.busy=false;return afterSignIn(data.session)}
    if(kind==="signup"){const name=v("au-name"),pass=document.getElementById("au-pass").value;a.email=v("au-email").toLowerCase();render();
      const {data,error}=await sb.auth.signUp({email:a.email,password:pass,options:{data:{name},emailRedirectTo:location.origin}});
      if(error)return go({err:authMsg(error)});
      if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)return go({step:"signin",err:"An account with that email already exists. Sign in instead."});
      if(data.session){a.busy=false;return afterSignIn(data.session)}
      return go({step:"code"})}
    if(kind==="code"){const token=v("au-code").replace(/\s/g,"");render();
      const {data,error}=await sb.auth.verifyOtp({email:a.email,token,type:"signup"});
      if(error){const r=await sb.auth.verifyOtp({email:a.email,token,type:"email"});if(r.error)return go({err:authMsg(error)});a.busy=false;return afterSignIn(r.data.session)}
      a.busy=false;return afterSignIn(data.session)}
    if(kind==="resend"){const {error}=await sb.auth.resend({type:"signup",email:a.email});return go(error?{err:authMsg(error)}:{msg:"New code sent. Use the newest email."})}
    if(kind==="forgot"){a.email=v("au-email").toLowerCase();render();
      const {error}=await sb.auth.resetPasswordForEmail(a.email,{redirectTo:location.origin});
      if(error)return go({err:authMsg(error)});return go({step:"reset",msg:"If that email has an account, a code is on its way."})}
    if(kind==="reset"){const token=v("au-code").replace(/\s/g,""),np=document.getElementById("au-newpass").value;render();
      const {error}=await sb.auth.verifyOtp({email:a.email,token,type:"recovery"});if(error)return go({err:authMsg(error)});
      const r=await sb.auth.updateUser({password:np});if(r.error)return go({err:authMsg(r.error)});
      const {data}=await sb.auth.getSession();a.busy=false;toast("Password updated");return afterSignIn(data.session)}
    if(kind==="newpass"){const np=document.getElementById("au-newpass").value;
      const r=await sb.auth.updateUser({password:np});if(r.error)return go({err:authMsg(r.error)});
      const {data}=await sb.auth.getSession();a.busy=false;toast("Password updated");return afterSignIn(data.session)}
  }catch(e){go({err:authMsg(e)})}
}

function localJobs(){const l=LS.get("irr.jobs")||{};Object.values(l).forEach(normalizeJob);return l}
function checkLocalImport(){const n=Object.keys(localJobs()).length;S.localCount=n&&!LS.get("irr.imported")?n:0;S.impSel={};if(S.localCount)render()}
function importView(){
  const loc=localJobs();const ids=Object.keys(loc).sort((a,b)=>(loc[b].updatedAt||0)-(loc[a].updatedAt||0));
  const sel=S.impSel||{};const nSel=ids.filter(id=>sel[id]&&!S.jobs[id]).length;

    <p class="small" style="margin:0">These were saved on this device before sign-in, so the team can't see them. Tick only real jobs you want on the server. Anything already on the server is skipped, so nothing gets overwritten.</p></div>
  ${ids.map(id=>{const j=loc[id];const on=!!S.jobs[id];const d=j.info&&j.info.date?new Date(j.info.date+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"No date";
    const zones=(j.zones||[]).length,photos=(JSON.stringify(j).match(/"ph[a-z0-9]{6,}"/g)||[]).length,revs=(j.revs||[]).length;
    return `<label class="card imp ${on?"dim":""}" style="cursor:${on?"default":"pointer"}"><div class="row" style="align-items:flex-start;gap:12px">

      <div class="small muted">${esc([(j.info||{}).address,(j.info||{}).city].filter(Boolean).join(", ")||"No address")}</div>
      <div class="small muted">${esc(d)} · ${zones} zone${zones===1?"":"s"} · ${photos} photo${photos===1?"":"s"}${revs?` · report Rev ${revNo(j.revs[revs-1].n)}`:""} · last edited ${esc(j.updatedAt?new Date(j.updatedAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"unknown")}</div></div></div></label>`}).join("")}
  <div class="card"><div class="row"><button class="btn" data-impgo="1" ${nSel?"":"disabled"}>Upload ${nSel||""} selected</button><span class="spacer"></span>${delBtn("impdiscard","Remove all from this device")}</div>
    <p class="small muted" style="margin:0">Removing deletes only the copies on this device. Jobs already on the server aren't touched.</p>
    <div><button class="btn quiet sm" data-home="jobs">Decide later</button></div></div>`;
}
async function importSelected(){
  const loc=localJobs();const ids=Object.keys(S.impSel||{}).filter(id=>S.impSel[id]&&loc[id]);let done=0,skipped=0;
  toast("Uploading…");
  for(const id of ids){const j=loc[id];
    let exists=!!S.jobs[id];if(!exists){try{exists=(await db.doc("jobs/"+id).get()).exists}catch(e){exists=true}}
    if(exists){skipped++;continue}
    const phs=new Set();JSON.stringify(j).replace(/"(ph[a-z0-9]{6,})"/g,(m,p)=>phs.add(p));
    for(const p of phs){const u=await IDB.get("irr.ph."+p);if(u)try{await db.doc("photos/"+p).set({img:u})}catch(e){}}
    const bg=await IDB.get("irr.bg."+id);if(bg)try{await db.doc("jobmedia/"+id).set({img:bg})}catch(e){}
    S.jobs[id]=j;
    for(const r of (j.revs||[])){const h=await IDB.get("irr.rev."+id+"_"+revNo(r.n));if(h)try{await db.doc("revisions/"+id+"_"+revNo(r.n)).set({job:id,n:r.n,html:h})}catch(e){}}
    try{await db.doc("jobs/"+id).set(j);done++;delete loc[id]}catch(e){delete S.jobs[id]}
  }
  LS.set("irr.jobs",loc);S.impSel={};
  if(!Object.keys(loc).length){LS.set("irr.imported",true);S.localCount=0;S.home="jobs"}else S.localCount=Object.keys(loc).length;
  render();toast(`${done} uploaded${skipped?`, ${skipped} skipped (already on server)`:""}`);
}
async function discardLocal(){
  const loc=localJobs();
  for(const id of Object.keys(loc)){const j=loc[id];
    JSON.stringify(j).replace(/"(ph[a-z0-9]{6,})"/g,(m,p)=>{IDB.del("irr.ph."+p)});IDB.del("irr.bg."+id);
    (j.revs||[]).forEach(r=>IDB.del("irr.rev."+id+"_"+revNo(r.n)));}
  try{localStorage.removeItem("irr.jobs");localStorage.removeItem("irr.pricing")}catch(e){}
  LS.set("irr.imported",true);S.localCount=0;S.home="jobs";render();toast("Removed from this device");
}

  if(d.nextzone){const cur=j.zones.find(x=>x.id===S.zoneOpen);const sorted=[...j.zones].sort((a,b)=>ctlName(j,a.ctl).localeCompare(ctlName(j,b.ctl))||num(a.num)-num(b.num));const i=sorted.indexOf(cur);
    if(i>=0&&i<sorted.length-1)S.zoneOpen=sorted[i+1].id;else{const z=newZone(j);if(cur){z.ctl=cur.ctl;const used=j.zones.filter(x=>x.ctl===cur.ctl).map(x=>+x.num);let n=1;while(used.includes(n))n++;z.num=String(n);z.soil=cur.soil}j.zones.push(z);S.zoneOpen=z.id;scheduleSave(S.cur)}
    render();const el=document.querySelectorAll(".card")[1];if(el)el.scrollIntoView({block:"start"});return}
  if(d.mapopen){openMap();return}
  if(d.hide){S.mapHide[d.hide]=!S.mapHide[d.hide];rr();return}
  if(d.bgclear){delete j.map.geo;saveBg(j.id,null);return}
  if(d.satopen){satOpen();return}
  if(d.mkreport){render();window.scrollTo(0,0);return}
  if(d.tech){j.est.showTech=!j.est.showTech;scheduleSave(S.cur);rr();return}
  if(d.print){if(d.print==="report"){const rv=currentRev(j);if(!rv)return;getRevHtml(j,rv).then(h=>printDoc(h||reportHtml(j,rv)))}else printDoc(invoiceHtml(j));return}
  if(d.ohmans){if(d.ohmans==="edit"){S.ohmEdit=true;S.pricing._ohm_ok="no";savePricing();rr();return}
    if(d.ohmans==="no"){S.pricing._ohm_ok="no";S.ohmEdit=true;savePricing();rr();return}
    S.pricing._ohm_ok="yes";S.ohmEdit=false;savePricing();rr();toast("Ohm ranges saved for the team");return}
  if(d.ol){setP(j,d.ol,"OL");scheduleSave(S.cur);rr();return}
  if(d.csbrand){S.ctlDraft.brand=d.csbrand;rr();return}
  if(d.cswire){S.ctlDraft.wiring=d.cswire;rr();return}
  if(d.cszn){const dr=S.ctlDraft;dr.zones=Math.max(1,Math.min(99,(num(dr.zones)||1)+num(d.cszn)));dr.drip=dr.drip.filter(z=>z<=dr.zones);rr();return}
  if(d.csdrip){const dr=S.ctlDraft;const z=num(d.csdrip);dr.drip=dr.drip.includes(z)?dr.drip.filter(x=>x!==z):dr.drip.concat(z);rr();return}
  if(d.cscancel){S.ctlDraft=null;S.addingCtl=false;rr();return}
  if(d.csbuild){const first=!j.controllers.length;const r=buildController(j);scheduleSave(S.cur);if(first)S.tab="mainline";render();window.scrollTo(0,0);toast(`${r.c.name}: built ${r.n} zone${r.n===1?"":"s"}`);return}
  if(d.gonext){S.tab=d.gonext;if(d.gonext==="zones"){const z=j.zones.find(z=>!z.works);if(z)S.zoneOpen=z.id}render();window.scrollTo(0,0);return}
  if(d.gozone){S.tab="zones";S.zoneOpen=d.gozone;render();window.scrollTo(0,0);return}
  if(d.zfix){const [zi,kind]=d.zfix.split("|");const z=j.zones[+zi];if(!z)return;
    if(kind==="sol"||kind==="rebuild"){z.valve=Object.assign({},z.valve,{action:kind});toast(kind==="sol"?"Solenoid replacement added":"Valve rebuild added")}
    if(kind==="lat"){z.laterals=z.laterals||[];z.laterals.push(TPL.lateral());toast("Lateral break added. Fill in its size and length below")}
    scheduleSave(S.cur);rr();return}
  if(d.tl){j.est.tl=Object.assign({},j.est.tl||{});const l=buildEstimate(j).lines.find(x=>lineKey(x)===d.tl);if(l){j.est.tl[d.tl]=lineColor(j,l)==="r"?"y":"r"}scheduleSave(S.cur);rr();return}
  if(d.outcome){j.outcome=d.outcome;if(d.outcome==="approved"&&j.info.status!=="Completed")j.info.status="Approved";if(d.outcome==="declined")j.info.status="Declined";if(d.outcome==="waiting"&&j.info.status!=="Completed")j.info.status="Audited";scheduleSave(S.cur);rr();return}
  if(d.compissue){const c=j.completion;if(!c)return;c.issuedAt=Date.now();c.by=(S.me&&S.me.name)||j.info.tech||"";c.fp=compPrint(j);c.html=completionHtml(j);j.info.status="Completed";scheduleSave(S.cur);rr();toast("Completion report issued");return}
  if(d.compprint){printDoc(j.completion.html||completionHtml(j));return}
  if(d.compcopy){const t=completionText(j);try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>fallbackCopy(t))}catch(e){fallbackCopy(t)}return}
  if(d.upnew){j.upsells=j.upsells||[];j.upsells.push(newUpsell());scheduleSave(S.cur);rr();return}
  if(d.upadd!=null){const g=suggestUpsells(j)[+d.upadd];if(g){j.upsells=j.upsells||[];j.upsells.push(newUpsell(g));scheduleSave(S.cur);rr();toast("Upgrade added")}return}
  if(d.mkinv){j.inv=Object.assign({kind:"estimate",status:"unpaid"},j.inv||{});j.inv.no=invNo();j.inv.at=Date.now();scheduleSave(S.cur);rr();return}
  if(d.invcopy){const txt=invoiceText(j);try{navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>fallbackCopy(txt))}catch(e){fallbackCopy(txt)}return}
  if(d.invsave){if(!downloads)return;const nm=((j.inv||{}).kind==="invoice"?"invoice-":"estimate-")+((j.inv||{}).no||"draft")+".html";
    downloads.save({filename:nm,data:standaloneReport(j,invoiceHtml(j))}).then(r=>{if(r.status==="saved")toast("Saved")}).catch(e=>{if(e&&e.code!=="declined")toast("Couldn't save the file here")});return}
  if(d.issue){if(troubleList(j).some(t=>!(getP(j,t.path+"_ph")||[]).length)){toast("Add the required photos first");return}issueRev(j);return}
  if(d.revert){revertTrouble(j,d.revert);return}
  if(d.phdel){const [pp,pid]=d.phdel.split("|");const arr=(getP(j,pp+"_ph")||[]).filter(x=>x!==pid);setP(j,pp+"_ph",arr);scheduleSave(S.cur);rr();return}
  if(d.phview){S.phBig=d.phview;rr();return}
  if(d.phclose){S.phBig=null;rr();return}
  if(d.viewrev){viewRev(j,+d.viewrev);return}
  if(d.copy){const rv=currentRev(j);if(!rv)return;const txt=reportText(j,rv);const done=()=>toast("Report copied");
    try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt))}catch(e){fallbackCopy(txt)}return}
  if(d.save){const rv=currentRev(j);if(!downloads||!rv)return;const name="estimate-"+(j.info.customer||"customer").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+(j.info.date||today())+"-rev"+revNo(rv.n)+".html";
    getRevHtml(j,rv).then(h=>inlinePhotos(h||reportHtml(j,rv))).then(h=>downloads.save({filename:name,data:standaloneReport(j,h)})).then(r=>{if(r.status==="saved")toast("Report saved")}).catch(e=>{if(e&&e.code!=="declined")toast("Couldn't save the file here")});return}
});
function liveMissing(){const j=job();if(!j)return;const miss=missingCustomer(j);
  const m=document.getElementById("missmsg"),b=document.getElementById("mkreport");
  if(m)m.innerHTML=miss.length?`Add the customer's details to produce the report. Still needed: <b>${miss.map(esc).join(", ")}</b>.`:"All customer details are in.";
  if(b)b.disabled=!!miss.length;}
const CAN_PRINT=!(window.claude&&window.claude.use);
async function printDoc(html){
  let pa=document.getElementById("printarea");if(!pa){pa=document.createElement("div");pa.id="printarea";document.body.appendChild(pa)}
  pa.innerHTML=`<article class="sheet">${await inlinePhotos(html)}</article>`;
  const root=document.documentElement;const prev=root.getAttribute("data-theme");root.setAttribute("data-theme","light");
  const restore=()=>{prev==null?root.removeAttribute("data-theme"):root.setAttribute("data-theme",prev);window.removeEventListener("afterprint",restore)};
  window.addEventListener("afterprint",restore);
  setTimeout(()=>{window.print();setTimeout(restore,1500)},150);
}
function fallbackCopy(txt){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?"Report copied":"Copy isn't available here. Select the report text instead.")}
function doRemove(key){
  const j=job();const [k,a,b]=key.split(":");
  if(k==="impdiscard"){discardLocal();return}
  if(k==="trainreset"){resetTraining();return}
  if(k==="staff"){setStaff(key.slice(6),false);return}
  if(k==="unadmin"){setAdmin(key.slice(8),false);return}
  if(k==="resetprices"){S.pricing={};savePricing();toast("Sample rates restored");return}
  if(k==="job"){if(!isAdmin())return;S.jobMenu=false;deleteJob(a);S.cur=null;S.home="jobs";render();toast("Job deleted");return}
  if(!j)return;
  const m={meter:()=>j.mainline[a].meters.splice(b,1),main:()=>j.mainline.splice(a,1),mod:()=>j.controllers[a].modules.splice(b,1),prog:()=>j.controllers[a].programs.splice(b,1),
    ctl:()=>{const id=j.controllers[a].id;j.controllers.splice(a,1);j.zones.forEach(z=>{if(z.ctl===id)z.ctl=j.controllers[0]?j.controllers[0].id:""})},
    zone:()=>{j.zones.splice(a,1);S.zoneOpen=null},lat:()=>j.zones[a].laterals.splice(b,1),add:()=>j.zones[a].adds.splice(b,1),cus:()=>j.zones[a].custom.splice(b,1),ext:()=>j.est.extra.splice(a,1),up:()=>j.upsells.splice(a,1),
    mapclear:()=>{j.map.items=[];j.map.lines=[];toast("Map cleared")},
    mapitem:()=>{j.map.items=j.map.items.filter(i=>i.id!==a);S.mapSel=null},mapline:()=>{j.map.lines=j.map.lines.filter(i=>i.id!==a);S.mapSel=null}}[k];
  if(m){m();scheduleSave(S.cur)}
}

function readBg(file){
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    let w=1000,h=700;const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
    const s=Math.max(w/img.width,h/img.height);const dw=img.width*s,dh=img.height*s;x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
    let q=.62,url=c.toDataURL("image/jpeg",q);while(url.length>230000&&q>.25){q-=.08;url=c.toDataURL("image/jpeg",q)}
    if(url.length>240000){c.width=700;c.height=490;c.getContext("2d").drawImage(img,(700-dw*.7)/2,(490-dh*.7)/2,dw*.7,dh*.7);url=c.toDataURL("image/jpeg",.5)}
    {const jj=job();if(jj&&jj.map.geo)delete jj.map.geo;}saveBg(S.cur,url)};img.onerror=()=>toast("That file isn't an image we can read");img.src=fr.result};fr.readAsDataURL(file);
}
boot();
})();
