<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprinkler Wrangler">
<meta name="description" content="Field app for evaluating irrigation jobs: inspections, property map, photos, reports and invoices.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D6B47'/%3E%3Cpath d='M32 12s-13 15-13 24a13 13 0 0 0 26 0c0-9-13-24-13-24z' fill='%23fff'/%3E%3C/svg%3E">
<title>Sprinkler Wrangler</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column field app — sticky job bar + scrolling section tabs, stacked inspection cards, thumb-sized controls */
:root{
  --tl-r:#D32F2F;--tl-y:#F2B705;--tl-g:#2E9E5B;
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --ink:#16211A; --muted:#58665C; --line:#CDD6CF;
  --accent:#1D6B47; --accent-ink:#FFFFFF; --accent-soft:#DCEDE3;
  --water:#2A6C99; --reclaim:#6B4C9A; --soil:#8A5A2B;
  --good:#2A7A4B; --warn:#A86B0C; --bad:#B42C22; --warn-soft:#FBF0DC; --bad-soft:#F8E1DE;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#17201B; --sunk:#111915; --ink:#E4ECE6; --muted:#98A79C; --line:#2A3830;
  --accent:#4DB080; --accent-ink:#06140D; --accent-soft:#1C3328;
  --water:#6AAAD8; --reclaim:#A98BD8; --soil:#C99563;
  --good:#5CC08A; --warn:#E3AA4C; --bad:#EF6E64; --warn-soft:#33281A; --bad-soft:#3A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#17201B; --sunk:#111915; --ink:#E4ECE6; --muted:#98A79C; --line:#2A3830;
  --accent:#4DB080; --accent-ink:#06140D; --accent-soft:#1C3328;
  --water:#6AAAD8; --reclaim:#A98BD8; --soil:#C99563;
  --good:#5CC08A; --warn:#E3AA4C; --bad:#EF6E64; --warn-soft:#33281A; --bad-soft:#3A1F1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:1.6rem} h2{font-size:1.35rem} h3{font-size:1.12rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{background:var(--accent);color:var(--accent-ink)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.bar h1{font-size:1.35rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:.8rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.iconbtn{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font-weight:600;font-size:.9rem;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs .inner{display:flex;gap:2px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0 auto;max-width:780px;width:100%}
.tab{border:0;background:transparent;padding:12px 12px 10px;font-family:var(--display);font-size:1.02rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;letter-spacing:.02em}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab.tab-done{color:var(--good)}
.tab.tab-need{color:var(--warn);background:var(--warn-soft);border-radius:8px 8px 0 0}
.tab.tab-need[aria-current="true"]{border-bottom-color:var(--warn);color:var(--warn)}
.tab.tab-done[aria-current="true"]{color:var(--good)}
.tabdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:5px;vertical-align:.1em}
.tab .ct{font-family:var(--mono);font-size:.72rem;margin-left:4px;opacity:.75}

main{padding-block:16px 80px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.card.sunk{background:var(--sunk)}
.cardhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cardhead h2,.cardhead h3{flex:1;min-width:0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],input[type=password],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 10px;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.q{display:grid;gap:6px}
.q>.ql{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.92rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:9px;padding:11px 16px;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* steppers / action list */
.acts{display:grid;gap:2px}
.act{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.act:last-child{border-bottom:0}
.act .al{flex:1;min-width:0}
.act .ap{font-size:.78rem;color:var(--muted)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.step button{width:38px;height:38px;border:0;background:var(--sunk);font-size:1.2rem;font-weight:700;padding:0;margin:0;display:grid;place-items:center;line-height:1}
.step input{width:56px;border:0;border-radius:0;text-align:center;min-height:38px;padding:0;margin:0;background:var(--surface);font-family:inherit;font-weight:700;font-size:1rem;line-height:38px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.step input::placeholder{text-align:center;color:var(--muted)}
/* Number boxes: no hidden browser spinner space, so numbers sit truly centered/aligned */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
.act.on .al{font-weight:700}
.combo{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:4px;background:var(--bg)}
.combo h4{margin:0;font-family:var(--display);font-size:1rem;letter-spacing:.03em}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.note{border-left:4px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:0 8px 8px 0;font-size:.92rem}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.info{border-color:var(--water);background:var(--sunk)}

/* job list */
.jobs{display:grid;gap:10px}
.job{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.job .date{font-family:var(--display);text-align:center;line-height:1;min-width:44px}
.job .date b{display:block;font-size:1.5rem}
.job .date small{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.job .who{min-width:0}
.job .who strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .who span{display:block;font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .amt{text-align:right;display:grid;gap:4px;justify-items:end}

/* ohm grid */
.ohms{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ohm{border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;gap:3px;background:var(--bg)}
.ohm b{font-family:var(--mono);font-size:.78rem}
.ohm input{min-height:36px;padding:6px;font-family:var(--mono)}
.ohm.short,.ohm.open{border-color:var(--bad);background:var(--bad-soft)}
.ohm.float{border-color:var(--bad);background:var(--bad-soft)}
.ohm .ohst{font-size:.7rem;font-weight:700;color:var(--muted);min-height:1em}
.ohm.short .ohst,.ohm.open .ohst,.ohm.float .ohst{color:var(--bad)}.ohm.high .ohst{color:var(--warn)}
.olbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:.7rem;font-weight:700;padding:2px 6px;justify-self:start}
.ohmtest{border:2px solid var(--water);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.ohm.high{border-color:var(--warn);background:var(--warn-soft)}
.rt{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.rt label{display:grid;gap:2px;font-size:.74rem;color:var(--muted);font-weight:600}
.rt input{min-height:36px;padding:6px;font-family:var(--mono)}

/* map */
.mapbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);touch-action:manipulation}
.mapbox svg{display:block;width:100%;height:auto;max-width:100%;user-select:none;-webkit-user-select:none}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tool{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);padding:6px 10px;font-weight:600;font-size:.86rem;min-height:40px}
.tool[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.sw{width:14px;height:14px;border-radius:50%;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}

/* estimate / report tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sec td{background:var(--sunk);font-family:var(--display);font-weight:700;font-size:.98rem;letter-spacing:.03em}
.totals{display:grid;gap:4px;justify-content:end;font-variant-numeric:tabular-nums}
.totals div{display:flex;gap:24px;justify-content:space-between;min-width:230px}
.totals .grand{font-family:var(--display);font-size:1.5rem;border-top:2px solid var(--ink);padding-top:6px;margin-top:4px}

/* report sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 18px;display:grid;gap:18px}
.sheet .dhead{text-align:center;border-bottom:3px solid var(--accent);padding-bottom:14px}.sheet .dtitle{font-family:var(--display);font-size:2.1rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;color:var(--ink)}.sheet .dsub{color:var(--muted);font-size:.92rem;margin-top:4px}.sheet .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin-top:16px;text-align:left}.sheet .dcell{border-top:1px solid var(--line);padding-top:8px}.sheet .dlab{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}.sheet .dval{font-size:.98rem;line-height:1.35}.sheet .dval b{font-size:1.12rem}
.sheet .lh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--accent);padding-bottom:12px}
.sheet .lh h1{font-size:1.9rem}
.sheet h2{font-size:1.15rem;border-bottom:1px solid var(--line);padding-bottom:4px}
.sheet ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.flag{color:var(--bad);font-weight:700}
.banner{padding:8px 12px;border-radius:8px;font-size:.9rem;background:var(--sunk);border:1px solid var(--line)}
.empty{text-align:center;padding:36px 16px;display:grid;gap:10px;justify-items:center}
.empty svg{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}

/* full-screen map editor */
.mapprev{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mapprev svg{display:block;width:100%;height:auto}
.mapopen{position:absolute;right:10px;bottom:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:7px 14px;font-size:.9rem}
.me{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.me-top{display:flex;align-items:center;gap:6px;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--accent);color:var(--accent-ink)}
.me-title{flex:1;min-width:0;font-family:var(--display);font-size:1.15rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:8px;min-width:40px;min-height:40px;padding:4px 10px;font-weight:700;font-size:1rem}
.me-btn.strong{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.me-btn:disabled{opacity:.4}
.me-stage{flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden;cursor:grab}
.me-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.me-bottom{background:var(--surface);border-top:1px solid var(--line);display:grid;gap:8px;padding-top:8px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.me-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me-sheet{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.me-sheet input{min-height:40px}
.me-pal{display:flex;gap:6px;overflow-x:auto;align-items:center;padding-bottom:2px;scrollbar-width:thin}
.me-sep{flex:none;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 6px}
.me-pal .tool{min-height:44px}
.phstrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:-2px}
.phthumb{position:relative}
.phimg{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:72px;height:72px;background:var(--sunk);display:block}
.phimg img{width:100%;height:100%;object-fit:cover;display:block}
.phx{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:700}
.phadd{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:8px;min-height:44px;padding:6px 12px;font-weight:700;font-size:.9rem;cursor:pointer}
.phadd.req{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.phmodal{position:fixed;inset:0;z-index:25;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.phcard{background:var(--surface);border-radius:14px;padding:18px;display:grid;gap:10px;max-width:520px;width:100%;border-top:5px solid var(--bad)}
.phcard p{margin:0}
.phbig{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.phbig img{max-width:100%;max-height:80vh;border-radius:6px}
.rphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.rph{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk)}
.rph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.rph figcaption{font-size:.78rem;padding:5px 7px;color:var(--muted)}
.isec{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;display:grid;gap:8px}
.isgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.isec ul{margin:4px 0 0}
ul.sol{list-style:none;padding-left:0}
ul.sol li::before{content:"✓ ";color:var(--good);font-weight:700}
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.up{border:1px dashed var(--line);border-radius:8px;padding:10px}
.paid{display:inline-block;border:3px solid var(--good);color:var(--good);font-family:var(--display);font-size:1.6rem;font-weight:700;padding:4px 14px;border-radius:6px;letter-spacing:.08em}
#printarea{display:none}
/* Keep the traffic-light colors (dots, bars, pills) when printing or saving as PDF */
.sheet,.sheet *,#printarea,#printarea *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  #app,#toast,#me,#phbig,.phmodal,body::before{display:none!important}
  #printarea{display:block}
  body{background:#fff}
  #printarea .sheet{border:0;padding:0}
  .isec,.rph,.up{break-inside:avoid}
  @page{margin:14mm}
}

  if(S.mode==="local"){S.bg[id]=(await IDB.get(KP()+"bg."+id))||null;ME.open?meDraw():render();return}
  if(S.mode==="db"){try{const s=await db.doc("jobmedia/"+id).get();S.bg[id]=s.exists?(s.data().img||null):null;ME.open?meDraw():render()}catch(e){}}
}
async function saveBg(id,img){
  S.bg[id]=img;const j=S.jobs[id];j.map.hasBg=!!img;scheduleSave(id);render();
  if(S.mode==="local"){if(img){if(!(await IDB.set(KP()+"bg."+id,img)))toast("This device is out of space for photos")}else{await IDB.del(KP()+"bg."+id)}}
  else if(S.mode==="db"&&!S.ro){try{img?await db.doc("jobmedia/"+id).set({img}):await db.doc("jobmedia/"+id).delete()}catch(e){handleWriteErr(e)}}

function startLocal(){
  S.mode="local";S.jobs=LS.get(KP()+"jobs")||{};Object.values(S.jobs).forEach(normalizeJob);S.custs=LS.get(KP()+"custs")||{};S.pricing=LS.get(KP()+"pricing")||{};ensureCustNos();migrateLegacyCusts();render();

async function boot(){
  render();
  if(!window.claude||!window.claude.use){if(window.SW_CONFIG&&window.SW_CONFIG.url){cloudBoot();return}startLocal();return}
  let d=null;try{d=await window.claude.use("db")}catch(e){d=null}
  window.claude.use("downloads").then(x=>{downloads=x;if(S.tab==="report")render()}).catch(()=>{});
  if(!d){startLocal();return}
  db=d;S.mode="db";
  db.collection("jobs").onSnapshot(snap=>{
    let changedCur=false;
    for(const ch of snap.docChanges()){
      const id=ch.doc.id;
      if(ch.type==="removed"){delete S.jobs[id];if(id===S.cur)changedCur=true;continue}
      if(saving[id]||dirty[id])continue;
      const data=ch.doc.data();
      const prev=S.jobs[id];
      if(prev&&prev.updatedAt>=data.updatedAt&&ch.type!=="added")continue;
      S.jobs[id]=normalizeJob(JSON.parse(JSON.stringify(data)));
      if(id===S.cur&&prev)changedCur=true;
    }
    S.loaded=true;
    const ae=document.activeElement;
    if(changedCur&&ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
    render();
  },err=>{toast("Lost connection to saved jobs");});
  db.doc("settings/pricing").onSnapshot(s=>{S.pricingReady=true;if(s.exists&&!pTimer){S.pricing=Object.assign({},(s.data()||{}).prices||{});if(S.home==="prices"&&!S.cur)renderKeepFocus()}},()=>{});
  setTimeout(()=>{if(!S.loaded){S.loaded=true;render()}},6000);
}
function renderKeepFocus(){const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA/.test(ae.tagName))return;render()}

/* Fill in any missing pieces so an older or partial job can never break a screen */
function normalizeJob(j){if(!j||typeof j!=="object")return j;
  (j.controllers||[]).forEach(c=>{(c.legs||[]).forEach(L=>(L.decoders||[]).forEach(d=>{if(d.st==="bad")d.st="nc"}));if(!c.legs){c.legs=[];const old=String(c.badDecoders||"").split(/[,\s]+/).filter(Boolean);if(old.length)c.legs.push({oc:"",decoders:old.map(a=>({addr:a,zones:"",st:"nc"}))})}});
  j.info=Object.assign({customer:"",phone:"",email:"",address:"",city:"",date:"",status:"Scheduled"},j.info||{});
  {const r0=(j.revs||[])[0];if(r0&&r0.at&&j.info.date){const d=new Date(r0.at);const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(j.info.date>iso){j.info.scheduledDate=j.info.scheduledDate||j.info.date;j.info.date=iso}}}
  j.info.status=jobStatus(j);
  j.map=Object.assign({items:[],lines:[]},j.map||{});j.mainline=Array.isArray(j.mainline)?j.mainline:[];j.controllers=Array.isArray(j.controllers)?j.controllers:[];j.zones=Array.isArray(j.zones)?j.zones:[];
  j.est=Object.assign({trip:true,laborHours:0,tax:8.25,discount:0,extra:[],terms:""},j.est||{});
  j.mainline.forEach(m=>{m.meters=m.meters||[];m.bf=m.bf||{};if(m.bf.lastTest&&!m.bf.testRec)m.bf.testRec="tag";if(m.bf.action==="insulate"){m.bf.action="none";m.bf.insulate="yes"}if(!m.bf.present&&(m.bf.size||m.bf.type||m.bf.brand||m.bf.condition||m.bf.model))m.bf.present="yes";m.prv=m.prv||{};m.iso=m.iso||{};m.mv=m.mv||{};m.leak=m.leak||{}});
  if(j.controllers.length)j.setupDone=true;
  j.controllers.forEach(c=>{c.programs=c.programs||[];c.ohms=c.ohms||{};c.act=c.act||{};c.custom=c.custom||[];c.modules=c.modules||[]});
  j.zones.forEach(z=>{z.types=z.types||[];z.sizes=z.sizes||[];z.acts=z.acts||{};z.valve=z.valve||{action:"none"};z.laterals=z.laterals||[];z.adds=z.adds||[];z.custom=z.custom||[]});
  return j}
function ctlName(j,id){const c=j.controllers.find(c=>c.id===id);return c?c.name:"No controller"}
function hasLeak(m){return (m.meters||[]).some(x=>x.flow==="yes"&&x.side==="irrigation")}
/* Ohm bands (Bradley): under 24 short · 24–60 normal · 61–90 high → valve rebuild · over 90 floating common · OL/infinite open.
   Team can correct the cut-offs; stored with the price sheet settings. */
function ohmCuts(){const p=S.pricing;const g=(k,d)=>{const v=p[k];return v==null||v===""?d:num(v)};return {short:g("_ohm_short",24),high:g("_ohm_high",60),float:g("_ohm_float",90)}}
const OHM_TXT={short:"Short",high:"High · rebuild valve",float:"Floating common",open:"Open circuit",ok:"OK"};
const OHM_LONG={short:"short circuit",high:"high resistance, valve needs a rebuild",float:"floating common, likely a bad wire-nut connection",open:"open circuit, wire repair needed"};
function ohmState(v){if(v===""||v==null)return "";const t=String(v).trim();if(/^(ol|o\.l\.?|open|inf|∞)/i.test(t))return "open";const n=parseFloat(t);if(isNaN(n))return "";const c=ohmCuts();
  if(n<c.short)return "short";if(n>c.float)return "float";if(n>c.high)return "high";return "ok"}
/* Each zone's wire reading is picked as a range; an exact reading is optional */
const OHM_FIX={short:[["wire_trouble","Wire repair"],["valve_sol","Replace solenoid"]],high:[["valve_rebuild","Rebuild valve"],["valve_sol","Replace solenoid"]],float:[["wire_nut","Repair common / wire-nut"],["wire_splice","Locate & splice"]],open:[["wire_splice","Locate & splice"],["wire_run","Run new wire"],["zone_splitter","Zone splitter module"]]};
function zoneBand(c,z){const b=(c.ohmBand||{})[z];return b||ohmState((c.ohms||{})[z])}
function zoneFix(c,z){const st=zoneBand(c,z);const f=OHM_FIX[st];if(!f)return null;const pick=(c.ohmFix||{})[z];return f.some(x=>x[0]===pick)?pick:f[0][0]}
function ctlFlags(c){
  const f={ohm:[],decoders:[],sols:[],breaks:[],legOc:[],failedMods:0,unread:0};
  if(c.wiring==="conventional"){for(let z=1;z<=num(c.zones);z++){const st=zoneBand(c,z);if(!st)f.unread++;else if(st!=="ok")f.ohm.push({z,st,v:(c.ohms||{})[z]||"",fix:zoneFix(c,z)})}}
  f.wire=f.ohm.filter(x=>x.st!=="high");f.rebuild=f.ohm.filter(x=>x.st==="high");
  if(c.wiring==="2wire"){const tw=twoWire(c);f.decoders=tw.bad;f.sols=tw.sols;f.breaks=tw.breaks;f.legOc=tw.legOc}
  if(c.modular==="yes")f.failedMods=(c.modules||[]).filter(m=>m.status==="Failed").length;
  return f;
}
function buildEstimate(j){
  const L=[];
  const add=(sec,key,qty,note)=>{qty=num(qty);if(qty<=0)return;const d=PRICE_DEFAULTS[key];if(!d)return;const p=price(key,j);L.push({sec,key,label:d.l+(note?" — "+note:""),qty,unit:d.u,price:p,total:p*qty,m:d.m})};
  const addC=(sec,label,qty,p)=>{qty=num(qty);p=num(p);if(qty<=0||!label)return;L.push({sec,key:null,label,qty,unit:"each",price:p,total:p*qty,m:true})};
  if(j.est.trip!==false)add("Service","trip",1);
  (j.mainline||[]).forEach(m=>{
    const sec=m.name||"Mainline";
    if(hasLeak(m)&&m.leak.atZoneValve!=="yes")add(sec,"main_repair",m.leak.repairs||1,m.leak.location||"");
    if(bfTestDue(m))add(sec,"bf_test",1);
    if(m.bf.present==="no"){if(m.bf.noneAction!=="note")add(sec,"bf_install",1)}else{const a=m.bf.action;if(a==="repair")add(sec,"bf_repair",1);if(a==="replace")add(sec,"bf_replace",1);if(m.bf.insulate==="yes"||a==="insulate"||(a==="replace"&&m.bf.insulated==="no"))add(sec,"bf_insulate",1)}
    [["prv","prv"],["iso","iso"],["mv","mv"]].forEach(([k,p])=>{const c=m[k]||{};
      if(c.present==="no"&&(k==="iso"||k==="mv")){if(c.noneAction!=="none")add(sec,p+"_install",1);return}
      if(c.present!=="yes")return;
      if(k==="mv"&&c.pos==="upstream")add(sec,"mv_relocate",1);
      if(k==="prv"&&c.pos==="upstream")return;
      if(c.action==="repair")add(sec,p+"_repair",1);if(c.action==="replace")add(sec,p+"_replace",1)});
  });
  (j.controllers||[]).forEach(c=>{
    const sec=c.name||"Controller";const a=c.act||{};const f=ctlFlags(c);
    {const on=ctlRecs(c).filter(r=>r.pk&&recOn(c,r));const rep=on.some(r=>r.k==="replace");let prog=false;
      on.forEach(r=>{if(r.k==="transformer"&&rep)return;if(r.k==="decoder"||r.k==="module")return;if(r.pk==="ctl_program"){if(prog)return;prog=true}add(sec,r.pk,r.qty,r.detail)})}
    {const g={};f.ohm.forEach(x=>{if(x.fix)(g[x.fix]=g[x.fix]||[]).push(x.z)});Object.entries(g).forEach(([k,zs])=>add(sec,k,zs.length,"zone"+(zs.length>1?"s ":" ")+zs.join(", ")))}
    (c.custom||[]).forEach(x=>addC(sec,x.desc,x.qty||1,x.price));
    if(c.wiring==="2wire"&&f.decoders.length&&a.decoder!==false)add(sec,"decoder",f.decoders.length,f.decoders.join(", "));
    if(f.failedMods&&a.module!==false)add(sec,"module",f.failedMods);
  });
  const zs=[...(j.zones||[])].sort((a,b)=>ctlName(j,a.ctl).localeCompare(ctlName(j,b.ctl))||num(a.num)-num(b.num));
  zs.forEach(z=>{
    const sec="Zone "+(z.num||"?")+(j.controllers.length>1?" · "+ctlName(j,z.ctl):"");
    for(const t of SIZED)if(z.types.includes(t))for(const s of z.sizes)for(const a of headActs(t,s)){const q=z.acts[`${t}_${s}_${a}`];if(q){
      const k=headPriceKey(t,s,a);const d=PRICE_DEFAULTS[k];if(d&&(a==="raise"||a==="lower"))add(sec,k,q,`${s}" ${t==="mp"?"MP":t}`);else add(sec,k,q)}}
    for(const t of Object.keys(OTHER_ACTS))if(z.types.includes(t))for(const [k] of OTHER_ACTS[t])add(sec,k,z.acts[k]);
    const v=z.valve||{};
    if(v.action==="replace")add(sec,v.size==="2\""?"valve_2":v.size==="1.5\""?"valve_15":"valve_1",1);
    if(v.action==="rebuild")add(sec,"valve_rebuild",1);if(v.action==="sol")add(sec,"valve_sol",1);if(v.action==="locate")add(sec,"valve_locate",1);
    (z.laterals||[]).forEach(b=>{add(sec,"lat_repair",1,b.size);const ft=num(b.ft)-3;if(ft>0)add(sec,"lat_ft",ft);if(b.tree==="yes")add(sec,"lat_tree",1)});
    (z.adds||[]).forEach(h=>{add(sec,"add_head",1,`${h.size}" ${h.type==="mp"?"MP":h.type}`);add(sec,"add_ft",h.ft)});
    (z.custom||[]).forEach(c=>addC(sec,c.desc,c.qty,c.price));
  });
  if(num(j.est.laborHours)>0)add("Service","labor_hour",j.est.laborHours);
  if(j.mapSold==="sold")add("Add-ons","map_pkg",1);
  (j.est.extra||[]).forEach(c=>addC("Additional items",c.desc,c.qty,c.price));
  (SHOW_UPSELLS?(j.upsells||[]):[]).filter(u=>u.status==="accepted").forEach(u=>addC("Upgrades",u.desc||u.cat,Math.max(1,num(u.qty)||1),u.price));
  const sub=L.reduce((s,l)=>s+l.total,0);const disc=Math.min(num(j.est.discount),sub);const tax=(sub-disc)*num(j.est.tax)/100;
  return {lines:L,sub,disc,tax,total:sub-disc+tax};
}

function docketView(){

function cvar(n){return `var(${n})`}
function mapSvg(j,interactive,hideMap){
  const bg=S.bg[j.id];
  const hide=hideMap||{};
  let s=`<svg viewBox="0 0 1000 700" ${interactive?'id="mapsvg"':""} role="img" aria-label="Property map">
  <defs><pattern id="g${interactive?1:2}" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="var(--line)" stroke-width="1"/></pattern></defs>
  <rect width="1000" height="700" fill="var(--bg)"/>${bg?`<image href="${bg}" x="0" y="0" width="1000" height="700" preserveAspectRatio="xMidYMid slice" opacity=".9"/>`:`<rect width="1000" height="700" fill="url(#g${interactive?1:2})"/>`}`;
  for(const l of j.map.lines){if(hide[l.t])continue;const d=MAP_LINES.find(x=>x[0]===l.t);if(!d||!l.pts.length)continue;
    const sel=interactive&&S.mapSel===l.id;
    s+=`<polyline points="${l.pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${sel?"var(--bad)":cvar(d[2])}" stroke-width="${d[3]}" stroke-linecap="round" stroke-linejoin="round" ${d[4]?`stroke-dasharray="${d[4]}"`:""}/>`;
    if(interactive)s+=`<polyline data-mid="${l.id}" points="${l.pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="transparent" stroke-width="28"/>`;
    if(interactive&&S.drawLine===l.id)l.pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="var(--surface)" stroke="${cvar(d[2])}" stroke-width="3"/>`);
  }
  for(const it of j.map.items){if(hide[it.t])continue;const d=MAP_POINTS.find(x=>x[0]===it.t);if(!d)continue;
    const sel=interactive&&S.mapSel===it.id;const head=it.t==="head";const r=head?11:19;
    s+=`<g ${interactive?`data-mid="${it.id}"`:""} transform="translate(${it.x},${it.y})">${sel?`<circle r="${r+7}" fill="none" stroke="var(--bad)" stroke-width="3"/>`:""}
      <circle r="${r}" fill="${head?"var(--surface)":cvar(d[3])}" stroke="${head?"var(--ink)":"var(--surface)"}" stroke-width="${head?3:2.5}"/>
      <text text-anchor="middle" dy=".35em" font-family="IBM Plex Mono, monospace" font-size="${head?11:14}" font-weight="600" fill="${head?"var(--ink)":"var(--surface)"}">${esc(head?(it.sub||"").slice(0,2).toUpperCase():d[2])}</text>
      ${it.label?`<text y="${r+17}" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="15" font-weight="700" fill="var(--ink)" stroke="var(--surface)" stroke-width="4" paint-order="stroke">${esc(it.label)}</text>`:""}</g>`;
  }
  s+="</svg>";
  return s.replace(/<(\w+)([^>]*)>/g,(m,tag,attrs)=>{const st=[];let self=/\/\s*$/.test(attrs);attrs=attrs.replace(/\/\s*$/,"").replace(/ (fill|stroke)="(var\([^)]*\))"/g,(mm,a,v)=>{st.push(a+":"+v);return ""});return st.length?`<${tag}${attrs} style="${st.join(";")}"${self?"/":""}>`:m});
}

/* ---------------- Satellite view + GPS (Mapbox) ----------------
   The satellite picture becomes the map background, framed exactly like the 1000×700 drawing area,
   so the editor, report and storage all work unchanged. GPS positions are converted into that frame. */
function mbToken(){return (window.SW_CONFIG||{}).mapboxToken||""}
const SAT_STYLE="mapbox/satellite-streets-v12";
function mbStatic(lat,lng,z,hi){return `https://api.mapbox.com/styles/v1/${SAT_STYLE}/static/${lng.toFixed(6)},${lat.toFixed(6)},${z.toFixed(2)},0/1000x700${hi?"@2x":""}?access_token=${encodeURIComponent(mbToken())}`}
function merc(lat,lng,z){const W=512*Math.pow(2,z);const s=Math.sin(lat*Math.PI/180);return [(lng+180)/360*W,(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*W]}
function unmerc(x,y,z){const W=512*Math.pow(2,z);const n=Math.PI-2*Math.PI*y/W;return [180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))),x/W*360-180]}
function geoToXY(g,lat,lng){const c=merc(g.lat,g.lng,g.zoom),p=merc(lat,lng,g.zoom);return [500+(p[0]-c[0]),350+(p[1]-c[1])]}
function metersPerUnit(g){return 40075016.686*Math.cos(g.lat*Math.PI/180)/(512*Math.pow(2,g.zoom))}

/* picker */
function satOpen(){const j=job();const g=j.map.geo;
  S.sat={lat:g?g.lat:null,lng:g?g.lng:null,zoom:g?g.zoom:19,q:[j.info.address,j.info.city].filter(Boolean).join(", "),busy:false,err:"",msg:""};
  satRender();if(S.sat.lat==null&&S.sat.q)satSearch();}
function satClose(){S.sat=null;const el=document.getElementById("satpick");if(el)el.remove();document.body.style.overflow="";rr()}
function satRender(){

    el.addEventListener("click",satClick);el.addEventListener("submit",ev=>{ev.preventDefault();const i=document.getElementById("sat-q");S.sat.q=i?i.value:"";satSearch()})}

    ${s.err?`<div class="note bad">${esc(s.err)}</div>`:""}${s.msg?`<div class="note info">${esc(s.msg)}</div>`:""}
    <div class="satframe">${has?`<img id="sat-img" src="${mbStatic(s.lat,s.lng,s.zoom,false)}" alt="Satellite view of the property" data-sat="tap"><div class="satcross" aria-hidden="true"></div>`:`<div class="satempty">${s.busy?"Finding the property…":"Search the address or use your location."}</div>`}</div>
    ${has?`<div class="row"><button class="me-btn dark" data-sat="out" aria-label="Zoom out">−</button><button class="me-btn dark" data-sat="in" aria-label="Zoom in">+</button><span class="small muted spacer">About ${widthFt.toLocaleString()} ft across. Tap the picture to center it on that spot. Fit the whole yard in the frame.</span></div>
    <button class="btn" data-sat="use" ${s.busy?"disabled":""} style="min-height:48px">${s.busy?"Saving…":"Use this view"}</button>
    <p class="small muted" style="margin:0">Anything already drawn stays where it is on the frame. Drag items onto the right spots afterwards.</p>`:""}
  </div>`;
}
async function satSearch(){const s=S.sat;if(!s.q.trim()){s.err="Type the property address.";return satRender()}
  s.busy=true;s.err="";satRender();
  try{const r=await fetch(`https://api.mapbox.com/search/geocode/v6/forward?q=${encodeURIComponent(s.q)}&country=us&limit=1&access_token=${encodeURIComponent(mbToken())}`);
    const d=await r.json();const f=d&&d.features&&d.features[0];
    if(!f){s.err="Couldn't find that address. Check it, or stand on the property and use My location.";}
    else{const [lng,lat]=f.geometry.coordinates;s.lat=lat;s.lng=lng;s.msg="";}
  }catch(e){s.err="Can't reach the map service. Check your signal."}
  s.busy=false;satRender();}
function satGps(){const s=S.sat;if(!navigator.geolocation){s.err="This phone doesn't share location with the browser.";return satRender()}
  s.busy=true;s.err="";s.msg="Getting your location…";satRender();
  navigator.geolocation.getCurrentPosition(p=>{s.lat=p.coords.latitude;s.lng=p.coords.longitude;s.busy=false;s.msg=`Centered on you (±${Math.round(p.coords.accuracy*3.281)} ft).`;satRender()},
    e=>{s.busy=false;s.msg="";s.err=e.code===1?"Location is blocked. Allow location for this site in your browser settings, then try again.":"Couldn't get your location. Try again outside, away from buildings.";satRender()},
    {enableHighAccuracy:true,timeout:15000,maximumAge:5000});}
async function satUse(){const s=S.sat;const j=job();if(!j||s.lat==null)return;s.busy=true;satRender();
  try{const r=await fetch(mbStatic(s.lat,s.lng,s.zoom,true));if(!r.ok)throw new Error("HTTP "+r.status);
    const blob=await r.blob();const url=URL.createObjectURL(blob);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const c=document.createElement("canvas");c.width=2000;c.height=1400;c.getContext("2d").drawImage(img,0,0,2000,1400);URL.revokeObjectURL(url);
    let q=.8,data=c.toDataURL("image/jpeg",q);while(data.length>900000&&q>.4){q-=.1;data=c.toDataURL("image/jpeg",q)}
    j.map.geo={lat:s.lat,lng:s.lng,zoom:s.zoom,at:Date.now()};
    await saveBg(j.id,data);scheduleSave(S.cur);
    S.sat=null;const el=document.getElementById("satpick");if(el)el.remove();document.body.style.overflow="";rr();toast("Satellite view saved");
  }catch(e){s.busy=false;s.err="Couldn't download the satellite picture. Check your signal and try again.";satRender()}}
function satClick(ev){const b=ev.target.closest("[data-sat]");if(!b)return;const a=b.dataset.sat;const s=S.sat;
  if(a==="close")return satClose();
  if(a==="gps")return satGps();
  if(a==="in"||a==="out"){s.zoom=Math.max(15,Math.min(21,s.zoom+(a==="in"?1:-1)));return satRender()}
  if(a==="use")return satUse();
  if(a==="tap"){const r=b.getBoundingClientRect();const dx=(ev.clientX-r.left)/r.width*1000-500,dy=(ev.clientY-r.top)/r.height*700-350;
    const c=merc(s.lat,s.lng,s.zoom);const ll=unmerc(c[0]+dx,c[1]+dy,s.zoom);s.lat=ll[0];s.lng=ll[1];s.msg="";return satRender()}
}

/* GPS inside the map editor */
function meGpsStart(){const g=(job()||{map:{}}).map.geo;ME.gps=null;if(!g||!navigator.geolocation)return;
  try{ME.gpsWatch=navigator.geolocation.watchPosition(p=>{ME.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};ME.gpsErr="";meReq();meChromeLight()},
    e=>{ME.gpsErr=e.code===1?"Location blocked. Allow it in browser settings to use Drop here.":"Waiting for GPS…";meChromeLight()},{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}catch(e){}}

  return `<g pointer-events="none"><circle cx="${xy[0]}" cy="${xy[1]}" r="${r}" style="fill:#2F7BFF;fill-opacity:.15;stroke:#2F7BFF;stroke-opacity:.5" stroke-width="${1.5*k}"/>
    <circle cx="${xy[0]}" cy="${xy[1]}" r="${9*k}" style="fill:#2F7BFF;stroke:#fff" stroke-width="${3*k}"/></g>`}

  const inFrame=xy&&xy[0]>=0&&xy[0]<=1000&&xy[1]>=0&&xy[1]<=700;
  const label=ME.tool==="select"?"":isLine?"📍 Add point here":"📍 Drop here";
  const status=!ME.gps?(ME.gpsErr||"Waiting for GPS…"):!inFrame?"You're outside this map's area":`GPS ±${Math.round(ME.gps.acc*3.281)} ft`;
  return `<div class="me-row gpsbar"><span class="gpsdot"></span><span class="small spacer" id="me-gpsstat">${esc(status)}</span>
    ${ME.gps&&inFrame?`<button class="btn quiet sm" data-me="gpscenter">Find me</button>`:""}${label?`<button class="btn sm" data-me="gpsdrop" ${ME.gps&&inFrame?"":"disabled"}>${label}</button>`:""}</div>`}

function meGpsDrop(){const xy=meGpsXY();if(!xy)return;meTap({p0:xy,item:null,vtx:null,line:null,gps:true})}

/* ---------------- full-screen map editor ---------------- */
const ME={open:false,vb:{x:0,y:0,w:1000,h:700},tool:"select",sel:null,draw:null,ptrs:new Map(),g:null,undo:[],layers:false,raf:0};
const HEAD_TOOLS=[["head:spray","Spray"],["head:mp","MP"],["head:rotor","Rotor"],["head:shrub","Shrub"],["head:bubbler","Bubbler"],["head:drip","Emitter"],["head:cap","Cap"]];
function meEl(id){return document.getElementById(id)}
function openMap(){
  const j=job();if(!j)return;loadBg(j.id);
  ME.open=true;ME.tool="select";ME.sel=null;ME.draw=null;ME.undo=[];ME.layers=false;ME.branch=null;

  el.innerHTML=`<div class="me-top" id="me-top"></div><div class="me-stage" id="me-stage"><svg id="me-svg" preserveAspectRatio="none"></svg></div><div class="me-bottom" id="me-bottom"></div>`;

}
function closeMap(){ME.open=false;{const jj=job();if(jj){const t=linkMapZones(jj);if(t.length){scheduleSave(S.cur);toast(`Zone${t.length>1?"s":""} ${t.join(", ")} linked from the map. Confirm each one works.`)}}}meGpsStop();if(ME.ro){ME.ro.disconnect();ME.ro=null}const el=meEl("me");if(el)el.remove();document.body.style.overflow="";window.removeEventListener("resize",meResize);rr()}
/* The view is locked to the property (0–1000 × 0–700): it opens as large as possible, can't zoom out
   past the whole property, and panning stops at the property's edges. */
function meStageAspect(){const r=meEl("me-stage").getBoundingClientRect();return r.width&&r.height?r.height/r.width:0.7}
function meMaxW(){const a=meStageAspect();return a>0.7?1000:700/a}
function meClamp(){const v=ME.vb;const a=meStageAspect();let w=Math.max(120,Math.min(meMaxW(),v.w));const h=w*a;
  const cx=v.x+v.w/2,cy=v.y+v.h/2;let x=cx-w/2,y=cy-h/2;
  x=w<=1000?Math.max(0,Math.min(1000-w,x)):(1000-w)/2;y=h<=700?Math.max(0,Math.min(700-h,y)):(700-h)/2;
  ME.vb={x,y,w,h}}
function meResize(){if(!ME.open)return;const r=meEl("me-stage").getBoundingClientRect();if(!r.width||!r.height)return;const v=ME.vb;const h=v.w*r.height/r.width;if(Math.abs(h-v.h)<0.5)return;ME.vb={x:v.x,y:v.y,w:v.w,h};meClamp();meDraw()}
/* Open filling the whole screen with map (no empty bands); "Whole map" zooms out to show all of it */
function meCoverW(){const a=meStageAspect();return a>0.7?700/a:1000}
function meFit(){const w=meCoverW(),a=meStageAspect();ME.vb={x:500-w/2,y:350-w*a/2,w,h:w*a};meClamp()}
function meWhole(){ME.vb={x:0,y:0,w:99999,h:99999*meStageAspect()};meClamp()}
function meK(){const r=meEl("me-stage").getBoundingClientRect();return ME.vb.w/Math.max(1,r.width)}
function mePt(cx,cy){const r=meEl("me-stage").getBoundingClientRect();return [ME.vb.x+(cx-r.left)*ME.vb.w/r.width,ME.vb.y+(cy-r.top)*ME.vb.h/r.height]}
function clampPt(p){return [Math.round(Math.max(0,Math.min(1000,p[0]))),Math.round(Math.max(0,Math.min(700,p[1])))]}
function meReq(){if(ME.raf)return;ME.raf=requestAnimationFrame(()=>{ME.raf=0;meDraw()})}
function mePush(){const j=job();ME.undo.push(JSON.stringify(j.map));if(ME.undo.length>40)ME.undo.shift()}
function meUndo(){const j=job();if(!ME.undo.length)return;j.map=Object.assign(j.map,JSON.parse(ME.undo.pop()));ME.sel=null;ME.draw=null;scheduleSave(S.cur);meChrome();meDraw()}
function meDraw(){
  const j=job();if(!j||!ME.open)return;const svg=meEl("me-svg");const k=meK();const v=ME.vb;const hide=S.mapHide;const bg=S.bg[j.id];
  svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);
  let s=`<rect x="${v.x-10}" y="${v.y-10}" width="${v.w+20}" height="${v.h+20}" style="fill:var(--sunk)"/>
  <defs><pattern id="meg" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" style="stroke:var(--line)" stroke-width="${Math.min(1.5,k)}"/></pattern></defs>
  <rect width="1000" height="700" style="fill:var(--bg)"/>${bg?`<image href="${bg}" width="1000" height="700" preserveAspectRatio="xMidYMid slice" opacity=".9"/>`:`<rect width="1000" height="700" fill="url(#meg)"/>`}
  <rect width="1000" height="700" fill="none" style="stroke:var(--muted)" stroke-width="${1.5*k}" stroke-dasharray="${6*k} ${5*k}"/>`;

    s+=`<polyline points="${pts}" fill="none" style="stroke:var(${d[2]})" stroke-width="${d[3]*k}" stroke-linecap="round" stroke-linejoin="round" ${d[4]?`stroke-dasharray="${d[4].split(" ").map(x=>x*k).join(" ")}"`:""}/>`;
    s+=`<polyline data-line="${l.id}" points="${pts}" fill="none" stroke="transparent" stroke-width="${30*k}" stroke-linecap="round"/>`;

      <circle r="${r}" style="fill:${head?"var(--surface)":`var(${d[3]})`};stroke:${head?"var(--ink)":"var(--surface)"}" stroke-width="${(head?3:2.5)*k}"/>
      <text text-anchor="middle" dy=".35em" font-family="IBM Plex Mono, monospace" font-size="${(head?10:13)*k}" font-weight="600" style="fill:${head?"var(--ink)":"var(--surface)"}">${esc(head?(it.sub||"").slice(0,2).toUpperCase():d[2])}</text>
      ${it.label?`<text y="${r+15*k}" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="${13*k}" font-weight="700" style="fill:var(--ink);stroke:var(--surface)" stroke-width="${4*k}" paint-order="stroke">${esc(it.label)}</text>`:""}</g>`;

function toolLabel(t){if(t==="select")return "Move";const h=HEAD_TOOLS.find(x=>x[0]===t);if(h)return h[1]+" head";const p=MAP_POINTS.find(x=>x[0]===t);if(p)return p[1];const l=MAP_LINES.find(x=>x[0]===t);return l?l[1]:t}

function meSelItem(){const j=job();return ME.sel&&(ME.sel.kind==="item"?j.map.items.find(i=>i.id===ME.sel.id):j.map.lines.find(l=>l.id===ME.sel.id))}
function meClick(ev){

  if(a==="linkbranch"){const h=meSelItem();if(h&&ME.branch){mePush();unlinkItem(j,h.id,false);connectHead(j,h,ME.branch);scheduleSave(S.cur);meChrome();meDraw()}return}

  if(a==="unpt"){const l=j.map.lines.find(x=>x.id===ME.draw);if(l){mePush();l.pts.pop();if(!l.pts.length){j.map.lines=j.map.lines.filter(x=>x!==l);ME.draw=null}scheduleSave(S.cur);meChrome();meDraw()}return}

  if(a==="dup"){mePush();const c=Object.assign({},sel,{id:uid("i"),x:Math.min(1000,sel.x+40),y:Math.min(700,sel.y+30)});delete c.zone;if(c.t==="zv")c.label="";j.map.items.push(c);if(c.t==="head"&&sel.zone)connectHead(j,c,sel.zone);ME.sel={kind:"item",id:c.id};scheduleSave(S.cur);meChrome();meDraw();return}
  if(a==="extend"){ME.tool=sel.t;ME.draw=sel.id;meChrome();meDraw();return}

function meInput(ev){const t=ev.target;if(!t.dataset.mel)return;const sel=meSelItem();if(!sel)return;sel[t.dataset.mel]=t.value;scheduleSave(S.cur);meReq()}
function meZoom(f,cx,cy){const v=ME.vb;const w=Math.max(120,Math.min(meMaxW(),v.w*f));const s=w/v.w;ME.vb={x:cx-(cx-v.x)*s,y:cy-(cy-v.y)*s,w,h:v.h*s};meClamp();meReq()}
/* Trackpad/mouse: scroll pans the map; pinch (ctrl+wheel) or ctrl+scroll zooms */
function meWheel(ev){ev.preventDefault();if(ev.ctrlKey||ev.metaKey){const p=mePt(ev.clientX,ev.clientY);meZoom(Math.exp(ev.deltaY*0.01),p[0],p[1]);return}
  const r=meEl("me-stage").getBoundingClientRect();const k=ME.vb.w/r.width;ME.vb.x+=ev.deltaX*k;ME.vb.y+=ev.deltaY*k;meClamp();meReq()}
function meDown(ev){
  const st=meEl("me-stage");try{st.setPointerCapture(ev.pointerId)}catch(e){}
  ME.ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(document.activeElement&&document.activeElement.id==="me-label")document.activeElement.blur();
  if(ME.ptrs.size===2){const [a,b]=[...ME.ptrs.values()];ME.g={type:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y)||1,c0:mePt((a.x+b.x)/2,(a.y+b.y)/2),vb0:Object.assign({},ME.vb)};return}
  if(ME.ptrs.size>2)return;
  const j=job();const tEl=ev.target.closest("[data-item],[data-vtx],[data-line]");
  const p=mePt(ev.clientX,ev.clientY);const g={type:"pending",sx:ev.clientX,sy:ev.clientY,p0:p,vb0:Object.assign({},ME.vb),moved:false};
  if(tEl&&tEl.dataset.item){const it=j.map.items.find(i=>i.id===tEl.dataset.item);if(it){g.item=it;g.off=[it.x-p[0],it.y-p[1]]}}
  else if(tEl&&tEl.dataset.vtx){const [lid,i]=tEl.dataset.vtx.split(":");const l=j.map.lines.find(x=>x.id===lid);if(l){g.vtx=[l,+i];g.off=[l.pts[i][0]-p[0],l.pts[i][1]-p[1]]}}
  else if(tEl&&tEl.dataset.line)g.line=tEl.dataset.line;
  ME.g=g;
}
function meMove(ev){
  if(!ME.ptrs.has(ev.pointerId))return;ME.ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});const g=ME.g;if(!g)return;
  if(g.type==="pinch"&&ME.ptrs.size>=2){const [a,b]=[...ME.ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    const w=Math.max(120,Math.min(meMaxW(),g.vb0.w*g.d0/d));const h=g.vb0.h*w/g.vb0.w;const r=meEl("me-stage").getBoundingClientRect();
    const cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;ME.vb={w,h,x:g.c0[0]-cx*w/r.width,y:g.c0[1]-cy*h/r.height};meClamp();meReq();return}
  if(g.type!=="pending"&&g.type!=="drag"&&g.type!=="pan")return;
  if(!g.moved&&Math.hypot(ev.clientX-g.sx,ev.clientY-g.sy)>7){g.moved=true;
    if(g.item||g.vtx){mePush();g.type="drag";if(g.item)ME.sel={kind:"item",id:g.item.id}}else g.type="pan"}
  if(g.type==="drag"){const p=mePt(ev.clientX,ev.clientY);const q=clampPt([p[0]+g.off[0],p[1]+g.off[1]]);
    if(g.item){g.item.x=q[0];g.item.y=q[1];followLinks(job(),g.item)}else{g.vtx[0].pts[g.vtx[1]]=q}meReq()}
  if(g.type==="pan"){const r=meEl("me-stage").getBoundingClientRect();ME.vb.x=g.vb0.x-(ev.clientX-g.sx)*g.vb0.w/r.width;ME.vb.y=g.vb0.y-(ev.clientY-g.sy)*g.vb0.h/r.height;meClamp();meReq()}
}
function meUp(ev){
  ME.ptrs.delete(ev.pointerId);const g=ME.g;
  if(g&&g.type==="pinch"){if(ME.ptrs.size===0)ME.g=null;else ME.g={type:"done"};return}
  if(ME.ptrs.size)return;ME.g=null;if(!g)return;
  if(g.type==="drag"){scheduleSave(S.cur);meChrome();return}
  if(g.type!=="pending"||ev.type==="pointercancel")return;
  meTap(g);
}
/* ---- Valve branches: heads placed while a valve is active connect to it automatically ----
   Each new head joins the nearest point already on that valve's branch (the valve or one of its heads),
   so pipe branches the way it would in the ground. Auto lines remember their two ends and follow when moved. */
const isValve=it=>it&&(it.t==="zv"||it.t==="valve");
function valveName(v){return v?(v.label||(v.t==="zv"?"zone valve":"valve")):""}
function connectHead(j,head,vid,exclude){
  const v=j.map.items.find(i=>i.id===vid);if(!v)return;head.zone=vid;
  const nodes=[v].concat(j.map.items.filter(i=>i.zone===vid&&i.id!==head.id&&i.id!==exclude));
  let best=v,bd=Infinity;nodes.forEach(n=>{const d=(n.x-head.x)**2+(n.y-head.y)**2;if(d<bd){bd=d;best=n}});
  j.map.lines.push({id:uid("l"),t:head.sub==="drip"?"drip":"lateral",pts:[[best.x,best.y],[head.x,head.y]],label:"",auto:true,zone:vid,from:best.id,to:head.id});
}
/* Remove an item's links; anything that was fed through it reconnects to the nearest remaining point */
function unlinkItem(j,id,deleting){
  const it=j.map.items.find(i=>i.id===id);if(!it)return;
  if(isValve(it)&&deleting){j.map.lines=j.map.lines.filter(l=>!(l.auto&&l.zone===id));j.map.items.forEach(i=>{if(i.zone===id)delete i.zone});if(ME.branch===id)ME.branch=null;return}
  const kids=j.map.lines.filter(l=>l.auto&&l.from===id).map(l=>l.to);
  j.map.lines=j.map.lines.filter(l=>!(l.auto&&(l.from===id||l.to===id)));
  const vid=it.zone;if(!deleting)delete it.zone;
  kids.forEach(k=>{const h=j.map.items.find(i=>i.id===k);if(h&&vid)connectHead(j,h,vid,id)});
}
function followLinks(j,it){j.map.lines.forEach(l=>{if(!l.auto)return;if(l.from===it.id)l.pts[0]=[it.x,it.y];if(l.to===it.id)l.pts[l.pts.length-1]=[it.x,it.y]})}
function meBranchBar(){const j=job();const v=ME.branch&&j.map.items.find(i=>i.id===ME.branch);if(!v)return "";
  const n=j.map.items.filter(i=>i.zone===v.id).length;
  return `<div class="me-row branchbar"><span class="small spacer">Adding to <b>${esc(valveName(v))}</b>: ${n} head${n===1?"":"s"}. New heads connect automatically.</span><button class="btn quiet sm" data-me="branchstop">Stop</button></div>`}
function meTap(g){
  const j=job();const isLine=MAP_LINES.some(l=>l[0]===ME.tool);
  if(isLine){let p=clampPt(g.p0);if(g.item)p=[g.item.x,g.item.y];
    mePush();let l=ME.draw&&j.map.lines.find(x=>x.id===ME.draw);
    if(!l){l={id:uid("l"),t:ME.tool,pts:[],label:""};j.map.lines.push(l);ME.draw=l.id}
    l.pts.push(p);scheduleSave(S.cur);meChrome();meDraw();return}
  if(g.item){ME.sel={kind:"item",id:g.item.id};meChrome();meDraw();return}
  if(g.vtx){ME.sel={kind:"line",id:g.vtx[0].id};meChrome();meDraw();return}
  if(g.line){ME.sel={kind:"line",id:g.line};meChrome();meDraw();return}
  if(ME.tool==="select"){if(ME.sel){ME.sel=null;meChrome();meDraw()}return}
  const p=clampPt(g.p0);mePush();
  let it;if(ME.tool.startsWith("head:"))it={id:uid("i"),t:"head",sub:ME.tool.slice(5),x:p[0],y:p[1],label:"",notes:""};
  else it={id:uid("i"),t:ME.tool,sub:"",x:p[0],y:p[1],label:"",notes:""};
  j.map.items.push(it);
  if(it.t==="zv"){const nums=j.map.items.filter(i=>i.t==="zv"&&/^Z\d+$/.test(i.label||"")).map(i=>+i.label.slice(1));let n=1;while(nums.includes(n))n++;it.label="Z"+n}
  if(isValve(it)){ME.branch=it.id;toast(`${valveName(it)} placed. Pick a head type and its heads will connect to it.`)}
  else if(it.t==="head"&&ME.branch&&j.map.items.some(i=>i.id===ME.branch))connectHead(j,it,ME.branch);
  /* heads go down in quick succession, so keep the edit panel closed; tap a head later to edit it */
  ME.sel=it.t==="head"?null:{kind:"item",id:it.id};scheduleSave(S.cur);meChrome();meDraw();
}

/* ---- report ---- */
function findings(j,tech){
  const out=[];
  (j.mainline||[]).forEach(m=>{const it=[];
    (m.meters||[]).forEach(w=>{if(!w.num&&!w.reading&&!w.flow)return;let s=`Water meter${w.num?" #"+w.num:""}${w.reading?", reading "+w.reading:""}`;
      if(w.flow==="yes")s+=w.side==="irrigation"?`: <span class="flag">water flowing with the system off — leak on the irrigation side</span>`:w.side==="plumbing"?": flow on the house plumbing side (not part of irrigation)":": flow detected";else if(w.flow==="no")s+=": no flow with the system off";it.push(s)});
    if(hasLeak(m)){if(m.leak.visible==="yes")it.push(`Leak found${m.leak.location?" at "+esc(m.leak.location):""}${m.leak.atZoneValve==="yes"?" (at a zone valve, see zone repairs)":""}.`);else it.push("Leak not visible at the surface; locating is included in the repair.")}
    const bf=m.bf;if(bf.present==="no")it.push(`<span class="flag">No backflow preventer found.</span> Texas (TCEQ) requires backflow prevention on irrigation connected to drinking water.${bf.noneAction==="note"?" Technician noted protection may be installed elsewhere.":""}`);else if(bf.size||bf.type||bf.condition||bf.brand){let s=`Backflow preventer${bf.size?" "+esc(bf.size):""}${bf.type?" "+esc(bf.type):""}${brandName(bf.brand,bf.brandOther)?" · "+esc(brandName(bf.brand,bf.brandOther)):""}${bf.model?" "+esc(bf.model):""}${bf.serial?" (serial "+esc(bf.serial)+")":""}${bf.condition?", condition "+esc(bf.condition.toLowerCase()):""}`;if(bf.insulated==="yes")s+=", insulated";it.push(s)}
    if(bf.present!=="no"&&bf.insulated==="no")it.push("Backflow preventer is not insulated (freeze risk)");
    if(bfTestDue(m))it.push(`<span class="flag">Backflow test due:</span> ${bf.testRec==="unknown"?"no test tag or record was found":"last tested "+esc(new Date(bf.lastTest+"T12:00").toLocaleDateString("en-US"))+", more than 12 months ago"}.`);
    [["prv","Pressure reducing valve"],["iso","Isolation valve"],["mv","Master valve"]].forEach(([k,l])=>{const c=m[k];if(c.present==="yes")it.push(`${l}${c.pos?` (${c.pos} of backflow)`:""}${c.size?", "+esc(c.size):""}${c.condition?", condition "+esc(c.condition.toLowerCase()):""}`);else if(c.present==="no"&&(k==="iso"||k==="mv"))it.push(`No ${l.toLowerCase()} installed.${c.noneAction!=="none"?" Installing one is recommended.":""}`);else if(c.present==="no"&&tech)it.push(`No ${l.toLowerCase()}`);
      if(c.present==="yes"&&k==="mv"&&c.pos==="upstream")it.push(`<span class="flag">Code violation:</span> the master valve is upstream of the backflow preventer. It must be downstream.`);
      if(c.present==="yes"&&k==="prv"&&c.pos==="upstream"&&c.action==="plumber")it.push("Recommended: have a licensed plumber service the pressure reducing valve (it is on the house side of the backflow).")});
    if(m.notes)it.push(esc(m.notes));
    if(it.length)out.push([m.name||"Mainline",it]);
  });
  (j.controllers||[]).forEach(c=>{const it=[];const f=ctlFlags(c);
    it.push(`${[ctlBrand(c),c.model].filter(Boolean).map(esc).join(" ")||"Controller"}${c.location?" at "+esc(c.location):""}, ${num(c.zones)} zones, ${c.wiring==="2wire"?"2-wire":"conventional wiring"}${c.modular==="yes"?", modular":""}`);
    if(c.power==="no")it.push(`<span class="flag">No power to the controller</span>${c.powerIssue?` — ${c.powerIssue==="outlet"?"outlet has no power":c.powerIssue==="controller"?"the controller itself won't power on":"transformer failed"}`:""}`);
    ctlRecs(c).filter(r=>!r.pk&&recOn(c,r)).forEach(r=>it.push("Recommended: "+esc(r.label)+"."));
    if(c.rain==="no")it.push("No rain/freeze sensor installed. One is recommended.");else if(c.rain==="yes")it.push(c.rainStatus==="working"?"Rain/freeze sensor installed and working":c.rainStatus==="notworking"?`<span class="flag">Rain/freeze sensor not working</span>`:c.rainStatus==="bypassed"?`<span class="flag">Rain/freeze sensor bypassed or disconnected</span>`:"Rain/freeze sensor installed");
    f.ohm.forEach(x=>it.push(`<span class="flag">Zone ${x.z}: ${OHM_LONG[x.st]}</span>${tech&&x.v?` (${esc(String(x.v))}${/^\d/.test(String(x.v))?" Ω":""})`:""}`));if(c.wiring==="conventional"&&!f.ohm.length&&!f.unread&&num(c.zones))it.push("All zone wire readings normal");
    if(c.overcurrent==="yes")it.push(`<span class="flag">Overcurrent on the 2-wire path</span>${c.ocZones?`, affecting ${esc(c.ocZones)} zones`:""}`);
    if(f.decoders.length)it.push(`<span class="flag">Failed decoder${f.decoders.length>1?"s":""}</span>: ${f.decoders.map(esc).join(", ")}`);
    if(f.sols.length)it.push(`<span class="flag">Shorted solenoid${f.sols.length>1?"s":""}</span>: ${f.sols.map(esc).join(", ")}`);
    f.breaks.forEach(x=>it.push(`<span class="flag">2-wire path break likely</span>: ${esc(x.where)}`));
    if(c.wiring==="2wire"&&(c.legs||[]).length)it.push(twoWireTree(c));
    if(f.failedMods)it.push(`${f.failedMods} failed module${f.failedMods>1?"s":""}`);
    if(tech)(c.programs||[]).forEach(p=>{const tot=Object.values(p.runtimes||{}).reduce((s,v)=>s+num(v),0);if(p.starts||tot||p.days.length)it.push(`Program ${esc(p.name)}: starts ${esc(p.starts||"—")}, ${p.days.length?p.days.join(" "):"no days set"}, seasonal ${num(p.seasonal)}%, ${tot} min per cycle`)});
    if(c.notes)it.push(esc(c.notes));
    out.push([c.name||"Controller",it]);
  });
  const zs=[...(j.zones||[])].sort((a,b)=>ctlName(j,a.ctl).localeCompare(ctlName(j,b.ctl))||num(a.num)-num(b.num));
  zs.forEach(z=>{const it=[];if(z.works==="yes")it.push(`<b>Working properly.</b>`);if(z.works==="no")it.push(`<span class="flag">Not working${(z.symptoms||[]).length?": "+(z.symptoms||[]).map(k=>(SYMPTOMS.find(x=>x[0]===k)||["",k])[1].toLowerCase()).join(", "):""}.</span>`);
    const mh=mapHeadSummary(j,z);if(mh)it.push("Mapped: "+esc(mh));const types=z.types.map(t=>HEAD_TYPES.find(h=>h[0]===t)[1].toLowerCase());
    const desc=[types.length?types.join(", ")+" heads":"",z.sizes.length&&z.types.some(t=>SIZED.includes(t))?z.sizes.map(s=>s+'"').join("/"):"",z.soil?z.soil.toLowerCase()+" soil":"",z.sun?z.sun+" sun":""].filter(Boolean).join(" · ");
    if(desc)it.push(desc);
    const v=z.valve||{};if(v.condition&&v.condition!=="Good")it.push(`Zone valve condition: ${esc(v.condition.toLowerCase())}`);
    (z.laterals||[]).forEach(l=>it.push(`<span class="flag">Broken ${esc(l.size)} lateral line</span>${num(l.ft)?`, about ${num(l.ft)} ft to repair`:""}${l.tree==="yes"?", tree roots present":""}`));
    if(z.notes)it.push(esc(z.notes));
    out.push([`Zone ${z.num}${j.controllers.length>1?" · "+ctlName(j,z.ctl):""}`,it]);
  });
  const tl=troubleList(j);
  return out.map(([h,it])=>[h,it,tl.filter(t=>t.sec===h)]);
}

function suggestUpsells(j){
  const S2=[];const have=new Set((j.upsells||[]).map(u=>u.cat+"|"+u.sec));

  j.controllers.forEach(c=>{if(!(c.act||{}).replace)add("Smart controller",c.name,"Upgrade to a smart Wi-Fi controller","Adjusts watering to the weather automatically and can be run from a phone. Many Texas water utilities offer rebates.","ctl_replace");
    if(c.rain==="no"&&!(c.act||{}).rainAdd)add("Rain/freeze sensor",c.name,"Add a rain/freeze sensor","Stops watering during rain and freezing temperatures; required on new Texas systems.","rain_add")});
  const spray=j.zones.filter(z=>z.types.includes("spray"));
  if(spray.length)add("Water-efficient nozzles","Whole property",`Convert spray nozzles to MP rotators (${spray.length} zone${spray.length===1?"":"s"})`,"Slower, more even watering that cuts runoff on clay soil and uses less water.","cnoz_mp",spray.length*6);

/* ---------------- Traffic-light audit (Red / Yellow / Green) ----------------
   Red = fix now (broken, leaking, not working). Yellow = recommended soon (worn, adjustment, below standard).
   Green = checked and good. Colors come from what the tech recorded; the tech can override any line. */
const TL={r:["Fix now","Broken, leaking or not working. Causes damage or wastes water if left."],y:["Recommended","Works, but worn, out of adjustment or below standard. Plan to fix soon."],g:["Good","Checked and working."]};
const RED_KEYS=new Set(["mv_relocate","bf_test","bf_install","wire_splice","wire_run","zone_splitter","wire_nut","main_repair","lat_repair","lat_ft","lat_tree","wire_trouble","transformer","decoder","module","valve_sol","valve_rebuild","valve_1","valve_15","valve_2","drip_repair","bf_repair","bf_replace","ctl_replace"]);
function lineKey(l){return l.sec+"|"+(l.key||l.label)}
function lineColor(j,l){if(l.sec==="Service"||l.sec==="Add-ons")return "";const ov=((j.est||{}).tl||{})[lineKey(l)];if(ov)return ov;
  if(l.key&&(RED_KEYS.has(l.key)||l.key.startsWith("rhead_")))return "r";return "y"}
function tlDot(c,title){return c?`<span class="tl tl-${c}" title="${esc(title||TL[c][0])}" aria-label="${esc(TL[c][0])}"></span>`:""}
const worst=(a,b)=>{const o={r:3,y:2,g:1,"":0,n:0};return (o[a]||0)>=(o[b]||0)?a:b};
/* section color from the recorded data plus its estimate lines */
function sectionColors(j){const e=buildEstimate(j);const C={};const bump=(sec,c)=>{C[sec]=worst(C[sec]||"",c)};
  e.lines.forEach(l=>{const c=lineColor(j,l);if(c)bump(l.sec,c)});
  (j.mainline||[]).forEach(m=>{const sec=m.name||"Mainline";const parts=[m.bf,m.prv,m.iso,m.mv].filter(Boolean);
    if(hasLeak(m)||m.bf.present==="no"||bfTestDue(m)||(m.mv&&m.mv.present==="yes"&&m.mv.pos==="upstream")||parts.some(p=>p.condition==="Failed"))bump(sec,"r");else if(parts.some(p=>p.condition==="Poor"||p.condition==="Fair")||m.bf.insulated==="no")bump(sec,"y");else bump(sec,"g")});
  (j.controllers||[]).forEach(c=>{const sec=c.name||"Controller";const f=ctlFlags(c);
    if(c.power==="no"||f.wire.length||c.overcurrent==="yes"||f.decoders.length||f.sols.length||f.breaks.length||f.failedMods)bump(sec,"r");
    else if(f.rebuild.length||c.rain==="no"||c.rainStatus==="notworking"||c.rainStatus==="bypassed")bump(sec,"y");else bump(sec,"g")});
  (j.zones||[]).forEach(z=>{const sec=zoneSecName(j,z);if(z.works==="no"||(z.laterals||[]).length)bump(sec,"r");else if(z.works==="yes")bump(sec,C[sec]||"g");else if(!C[sec])C[sec]="n"});
  return C}
/* ---------- System health score (0-100). Draft weights; Bradley to confirm. ----------
   Starts at 100, loses points for what the audit found. afterFix=true projects the score
   once every Fix now item is done. */
const HS_W={zones:35,water:20,protect:15,equip:15,sched:10,ctl:5};
function healthScore(j,afterFix){const P=[];const part=(k,area,lost,why)=>P.push({k,area,max:HS_W[k],lost:Math.min(HS_W[k],Math.max(0,lost)),why});
  const zs=j.zones||[];const ans=zs.filter(z=>z.works==="yes"||z.works==="no");const bad=zs.filter(z=>z.works==="no"||(z.laterals||[]).length);
  part("zones","Zones",afterFix||!ans.length?0:HS_W.zones*bad.length/Math.max(ans.length,1),bad.length?[`${bad.length} of ${ans.length} zone${ans.length===1?"":"s"} checked are not working properly`]:[]);
  const leak=(j.mainline||[]).some(hasLeak);part("water","Water loss",leak&&!afterFix?HS_W.water:0,leak?["Water flowing at the meter with the system off (leak)"]:[]);
  let pr=0;const pw=[];const e=buildEstimate(j);const onEst=k=>e.lines.some(l=>l.key===k);
  (j.mainline||[]).forEach(m=>{if((m.bf||{}).present==="no"&&!(afterFix&&onEst("bf_install"))){pr+=8;pw.push("No backflow preventer")}if(bfTestDue(m)&&!(afterFix&&onEst("bf_test"))){pr+=3;pw.push("Backflow test overdue or unknown")}});
  (j.controllers||[]).forEach(c=>{if(c.rain==="no"&&!(afterFix&&onEst("rain_add"))){pr+=4;pw.push("No rain/freeze sensor")}else if(c.rain==="yes"&&(c.rainStatus==="notworking"||c.rainStatus==="bypassed")&&!(afterFix&&onEst("rain_replace"))){pr+=4;pw.push("Rain/freeze sensor not working")}});
  part("protect","Protection",pr,pw);
  let eq=0;const ew=[];equipmentRows(j).forEach(r=>{const t=gradeFor(r.cat,r.brand,r.line);if(!t)return;if(t[0]==="eco"){eq+=4;ew.push(`${r.part}: economy grade`)}else if(t[0]==="std"){eq+=1.5}});
  if(eq&&!ew.length)ew.push("Mostly standard-grade parts");part("equip","Equipment quality",eq,ew);
  let sc=0;const sw=[];const fixedProg=afterFix&&onEst("ctl_program");

const BADCOND=["Poor","Failed"];
function troubleList(j){
  const L=[];const add=(path,label,sec)=>L.push({path,label,sec});
  (j.mainline||[]).forEach((m,mi)=>{const b=`mainline.${mi}`,sec=m.name||"Mainline";
    (m.meters||[]).forEach((w,wi)=>{if(w.flow==="yes")add(`${b}.meters.${wi}.flow`,`Water meter${w.num?" #"+w.num:""} showing flow with the system off`,sec)});
    if(hasLeak(m)&&m.leak.visible==="yes")add(`${b}.leak.visible`,"Visible mainline leak",sec);
    if(BADCOND.includes(m.bf.condition))add(`${b}.bf.condition`,`Backflow preventer in ${m.bf.condition.toLowerCase()} condition`,sec);
    [["prv","Pressure reducing valve"],["iso","Isolation valve"],["mv","Master valve"]].forEach(([k,l])=>{const c=m[k];if(c.present==="yes"&&BADCOND.includes(c.condition))add(`${b}.${k}.condition`,`${l} in ${c.condition.toLowerCase()} condition`,sec)});
  });
  (j.controllers||[]).forEach((c,ci)=>{const b=`controllers.${ci}`,sec=c.name||"Controller";
    if(c.power==="no")add(`${b}.power`,"No power to the controller",sec);
    if(c.wiring==="2wire"&&c.overcurrent==="yes")add(`${b}.overcurrent`,"Overcurrent on the 2-wire path",sec);
  });
  (j.zones||[]).forEach((z,zi)=>{const b=`zones.${zi}`,sec=`Zone ${z.num}${j.controllers.length>1?" · "+ctlName(j,z.ctl):""}`;
    if(BADCOND.includes((z.valve||{}).condition))add(`${b}.valve.condition`,`Zone valve in ${z.valve.condition.toLowerCase()} condition`,sec);
    (z.laterals||[]).forEach((l,li)=>add(`${b}.laterals.${li}.brk`,`Broken ${l.size||""} lateral line`.replace("  "," "),sec));
  });
  return L;
}

S.ph={};
function phKeyLocal(id){return KP()+"ph."+id}
async function loadPhoto(id){

  if(S.mode==="local")S.ph[id]=(await IDB.get(phKeyLocal(id)))||null;

function hydratePhotos(root){
  (root||document).querySelectorAll("img[data-ph]").forEach(img=>{const id=img.dataset.ph;if(img.getAttribute("src"))return;
    const set=u=>{if(u)img.src=u;else img.alt="Photo not available on this device"};
    if(S.ph[id])set(S.ph[id]);else loadPhoto(id).then(set)});
  if(S.phBig){const ov=document.getElementById("phbig");if(!ov){const d=document.createElement("div");d.id="phbig";d.className="phbig";d.innerHTML=`<img data-ph="${S.phBig}" alt="Issue photo"><button class="btn" data-phclose="1">Close</button>`;d.addEventListener("click",()=>{S.phBig=null;d.remove()});document.body.appendChild(d);hydratePhotos(d)}}
}
async function inlinePhotos(html){
  const ids=[...new Set([...html.matchAll(/data-ph="([^"]+)"/g)].map(m=>m[1]))];
  for(const id of ids)await loadPhoto(id);
  return html.replace(/<img data-ph="([^"]+)"/g,(m,id)=>S.ph[id]?`<img src="${S.ph[id]}" data-ph="${id}"`:m);
}

function addPhoto(path,file){
  const j=job();if(!j)return;const jid=j.id;
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=async()=>{
    const max=1280;const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);let q=.72,url=c.toDataURL("image/jpeg",q);
    while(url.length>200000&&q>.3){q-=.08;url=c.toDataURL("image/jpeg",q)}
    if(url.length>220000){const c2=document.createElement("canvas");c2.width=Math.round(c.width*.7);c2.height=Math.round(c.height*.7);c2.getContext("2d").drawImage(c,0,0,c2.width,c2.height);url=c2.toDataURL("image/jpeg",.6)}
    const id=uid("ph");S.ph[id]=url;
    if(S.mode==="local"){if(!(await IDB.set(phKeyLocal(id),url))){toast("This device is out of space for photos");return}}
    else if(S.mode==="db"){try{await db.doc("photos/"+id).set({img:url,job:jid,at:Date.now(),path})}catch(e){handleWriteErr(e);return}}
    const jj=S.jobs[jid];if(!jj)return;const arr=(getP(jj,path+"_ph")||[]).slice();arr.push(id);setP(jj,path+"_ph",arr);scheduleSave(jid);rr();toast("Photo saved");
  };img.onerror=()=>toast("That file isn't a photo we can read");img.src=fr.result};fr.readAsDataURL(file);
}

const SHOW_PORTAL=false;
function sbErr(e){const m=(e&&e.message)||String(e||"");const c=(e&&e.code)||"";
  return {code:/quota|exceed|too large|payload/i.test(m)?"quota_exceeded":(c==="42501"||/row-level|permission|not allowed/i.test(m))?"invalid_argument":"unavailable",message:m}}
function dataUrlToBlob(u){const [h,b]=u.split(",");const mime=(h.match(/data:([^;]+)/)||[])[1]||"image/jpeg";const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
function blobToDataUrl(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)})}
function makeSupaDb(){
  const BUCKET="photos";
  const snap=(id,data)=>({id,exists:data!=null,data:()=>data==null?undefined:data,metadata:{fromCache:false,hasPendingWrites:false}});
  async function up(path,url){const {error}=await sb.storage.from(BUCKET).upload(path,dataUrlToBlob(url),{upsert:true,contentType:"image/jpeg"});if(error)throw sbErr(error)}
  async function down(path){const {data,error}=await sb.storage.from(BUCKET).download(path);if(error||!data)return null;return await blobToDataUrl(data)}
  const custOf=j=>({customer_email:String((j.info||{}).email||"").trim().toLowerCase()||null,customer_name:(j.info||{}).customer||null,address:[(j.info||{}).address,(j.info||{}).city].filter(Boolean).join(", ")||null});
  const lastEmail={};
  async function afterJobSave(id,j){
    const c=custOf(j);
    if(lastEmail[id]!==undefined&&lastEmail[id]!==c.customer_email){await sb.from("reports").update({customer_email:c.customer_email,customer_name:c.customer_name,address:c.address}).eq("job_id",id)}
    lastEmail[id]=c.customer_email;
    if(j.inv&&j.inv.no){const e=invoiceEstimate(j);
      const {error}=await sb.from("invoices").upsert(Object.assign({job_id:id,no:j.inv.no,kind:j.inv.kind||"estimate",status:j.inv.kind==="invoice"?(j.inv.status||"unpaid"):"estimate",total:e.total,html:invoiceHtml(j),updated_at:new Date().toISOString()},c));
      if(error)throw sbErr(error)}
  }
  function doc(path){const [col,id]=path.split("/");
    return {id,path,
      async get(){
        if(col==="jobs"){const {data,error}=await sb.from("jobs").select("data").eq("id",id).maybeSingle();if(error)throw sbErr(error);return snap(id,data&&data.data)}
        if(col==="settings"){const {data,error}=await sb.from("settings").select("data").eq("key",id).maybeSingle();if(error)throw sbErr(error);return snap(id,data&&data.data)}
        if(col==="customers"){const {data,error}=await sb.from("customers").select("data").eq("id",id).maybeSingle();if(error)throw sbErr(error);return snap(id,data&&data.data)}
        if(col==="jobmedia"){const img=await down("bg/"+id+".jpg");return snap(id,img?{img}:null)}
        if(col==="photos"){const img=await down("ph/"+id+".jpg");return snap(id,img?{img}:null)}
        if(col==="revisions"){const {data,error}=await sb.from("reports").select("html").eq("id",id).maybeSingle();if(error)throw sbErr(error);return snap(id,data?{html:data.html}:null)}
        return snap(id,null);
      },
      async set(d){
        if(col==="jobs"){const {error}=await sb.from("jobs").upsert(Object.assign({id,data:d,updated_at:new Date().toISOString()},{customer_email:custOf(d).customer_email}));if(error)throw sbErr(error);try{await afterJobSave(id,d)}catch(e){console.warn("invoice sync",e)}return}
        if(col==="settings"){const {error}=await sb.from("settings").upsert({key:id,data:d,updated_at:new Date().toISOString()});if(error)throw sbErr(error);return}
        if(col==="customers"){const {error}=await sb.from("customers").upsert({id,data:d,updated_at:new Date().toISOString()});if(error)throw sbErr(error);return}
        if(col==="jobmedia")return up("bg/"+id+".jpg",d.img);
        if(col==="photos")return up("ph/"+id+".jpg",d.img);
        if(col==="revisions"){const j=S.jobs[d.job]||{info:{},revs:[]};const r=(j.revs||[]).find(x=>x.n===d.n)||{};
          const html=await inlinePhotos(d.html);
          const row=Object.assign({id,job_id:d.job,rev:d.n,html,total:r.total||0,issued_at:new Date(r.at||Date.now()).toISOString(),issued_by:r.by||"",options:r.options||estOptions(j)},custOf(j));
          let {error}=await sb.from("reports").upsert(row);
          if(error&&/options/i.test(error.message||"")){delete row.options;({error}=await sb.from("reports").upsert(row))}
          if(error)throw sbErr(error);return}
      },
      async delete(){
        if(col==="jobs"){await sb.from("invoices").delete().eq("job_id",id);await sb.from("reports").delete().eq("job_id",id);const {error}=await sb.from("jobs").delete().eq("id",id);if(error)throw sbErr(error);return}
        if(col==="customers"){const {error}=await sb.from("customers").delete().eq("id",id);if(error)throw sbErr(error);return}
        if(col==="jobmedia"){await sb.storage.from(BUCKET).remove(["bg/"+id+".jpg"]);return}
        if(col==="photos"){await sb.storage.from(BUCKET).remove(["ph/"+id+".jpg"]);return}
      },
      onSnapshot(next,err){
        let alive=true;const deliver=async()=>{try{const s=await doc(path).get();if(alive)next(s)}catch(e){if(alive&&err)err(e)}};
        deliver();
        const ch=sb.channel("doc-"+path.replace(/[^a-z0-9]/gi,"-")).on("postgres_changes",{event:"*",schema:"public",table:col,filter:(col==="settings"?"key":"id")+"=eq."+id},()=>deliver()).subscribe();
        return ()=>{alive=false;sb.removeChannel(ch)};
      }
    }}
  function collection(name){return {
    doc:id=>doc(name+"/"+id),
    onSnapshot(next,err){
      let alive=true;const known=new Set();
      const mk=(type,id,data)=>({type,doc:snap(id,data),oldIndex:-1,newIndex:-1});
      (async()=>{
        const {data,error}=await sb.from(name).select("id,data");
        if(!alive)return;if(error){if(err)err(sbErr(error));return}
        const ch=(data||[]).map(r=>{known.add(r.id);return mk("added",r.id,r.data)});
        next({docs:[],size:ch.length,empty:!ch.length,docChanges:()=>ch,metadata:{fromCache:false,hasPendingWrites:false}});
      })();
      const channel=sb.channel("col-"+name).on("postgres_changes",{event:"*",schema:"public",table:name},p=>{
        if(!alive)return;let c;
        if(p.eventType==="DELETE"){const id=(p.old||{}).id;if(!id)return;known.delete(id);c=mk("removed",id,null)}
        else{const id=p.new.id;c=mk(known.has(id)?"modified":"added",id,p.new.data);known.add(id)}
        next({docs:[],size:1,empty:false,docChanges:()=>[c],metadata:{fromCache:false,hasPendingWrites:false}});
      }).subscribe();
      return ()=>{alive=false;sb.removeChannel(channel)};
    }}}
  return {doc,collection};
}

/* ---------- start the synced app once a technician is signed in ---------- */
function startDb(d){
  db=d;S.mode="db";S.loaded=false;
  db.collection("jobs").onSnapshot(snap=>{
    if(S.training)return;
    let changedCur=false;
    for(const ch of snap.docChanges()){
      const id=ch.doc.id;
      if(ch.type==="removed"){delete S.jobs[id];if(id===S.cur)changedCur=true;continue}
      if(saving[id]||dirty[id])continue;
      const data=ch.doc.data();const prev=S.jobs[id];
      if(prev&&prev.updatedAt>=data.updatedAt&&ch.type!=="added")continue;
      S.jobs[id]=normalizeJob(JSON.parse(JSON.stringify(data)));
      if(id===S.cur&&prev)changedCur=true;
    }
    if(!S.loaded){S.loaded=true;ensureCustNos();migrateLegacyCusts()}
    const ae=document.activeElement;
    if(changedCur&&ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
    if(ME.open)return;
    render();
  },()=>toast("Lost connection to saved jobs. Check your signal."));
  db.doc("settings/pricing").onSnapshot(s=>{S.pricingReady=true;if(s.exists&&!pTimer){S.pricing=Object.assign({},(s.data()||{}).prices||{});if(S.home==="prices"&&!S.cur)renderKeepFocus()}},()=>{});
  db.collection("customers").onSnapshot(snap=>{if(S.training)return;S.custsErr=false;
    for(const ch of snap.docChanges()){const id=ch.doc.id;if(ch.type==="removed"){delete S.custs[id];continue}const d=ch.doc.data();const prev=S.custs[id];if(prev&&d&&d.custNo&&prev.custNo!==d.custNo)prev.custNo=d.custNo;if(custTimers[id]&&prev)continue;if(prev&&prev.updatedAt>=d.updatedAt&&ch.type!=="added")continue;S.custs[id]=JSON.parse(JSON.stringify(d))}
    S.custsLoaded=true;if(S.loaded){ensureCustNos();migrateLegacyCusts()}
    const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;if(!ME.open)render()},()=>{S.custsErr=true;render()});
  loadResponses();try{sb.channel("col-customer_responses").on("postgres_changes",{event:"INSERT",schema:"public",table:"customer_responses"},()=>loadResponses()).subscribe()}catch(e){}
  setTimeout(()=>{S.pricingReady=true;if(!S.loaded){S.loaded=true;render()}},8000);
  render();
}

function authMsg(e){const m=(e&&e.message)||"";
  if(/invalid login/i.test(m))return "That email and password don't match. Try again, or reset your password.";
  if(/not confirmed/i.test(m))return "confirm";
  if(/already registered|already been registered/i.test(m))return "An account with that email already exists. Sign in instead.";
  if(/expired|invalid.*(otp|token)|token.*invalid/i.test(m))return "That code is wrong or has expired. Check the newest email or send a new code.";
  if(/rate|seconds|too many/i.test(m))return "Please wait a minute before asking for another code.";
  if(/password/i.test(m)&&/(short|least|weak)/i.test(m))return "Choose a password with at least 8 characters.";
  if(/fetch|network/i.test(m))return "Can't reach the server. Check your signal and try again.";
  return m||"Something went wrong. Try again.";
}

function portalView(){

  const m={meter:()=>j.mainline[a].meters.splice(b,1),main:()=>j.mainline.splice(a,1),mod:()=>j.controllers[a].modules.splice(b,1),ccus:()=>j.controllers[a].custom.splice(b,1),prog:()=>j.controllers[a].programs.splice(b,1),
    ctl:()=>{const id=j.controllers[a].id;j.controllers.splice(a,1);j.zones.forEach(z=>{if(z.ctl===id)z.ctl=j.controllers[0]?j.controllers[0].id:""})},
    zone:()=>{j.zones.splice(a,1);S.zoneOpen=null},lat:()=>j.zones[a].laterals.splice(b,1),add:()=>j.zones[a].adds.splice(b,1),cus:()=>j.zones[a].custom.splice(b,1),ext:()=>j.est.extra.splice(a,1),up:()=>j.upsells.splice(a,1),
    mapclear:()=>{j.map.items=[];j.map.lines=[];toast("Map cleared")},
    mapitem:()=>{j.map.items=j.map.items.filter(i=>i.id!==a);S.mapSel=null},mapline:()=>{j.map.lines=j.map.lines.filter(i=>i.id!==a);S.mapSel=null}}[k];
  if(m){m();scheduleSave(S.cur)}
}

function readBg(file){
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    let w=1000,h=700;const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
    const s=Math.max(w/img.width,h/img.height);const dw=img.width*s,dh=img.height*s;x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
    let q=.62,url=c.toDataURL("image/jpeg",q);while(url.length>230000&&q>.25){q-=.08;url=c.toDataURL("image/jpeg",q)}
    if(url.length>240000){c.width=700;c.height=490;c.getContext("2d").drawImage(img,(700-dw*.7)/2,(490-dh*.7)/2,dw*.7,dh*.7);url=c.toDataURL("image/jpeg",.5)}
    {const jj=job();if(jj&&jj.map.geo)delete jj.map.geo;}saveBg(S.cur,url)};img.onerror=()=>toast("That file isn't an image we can read");img.src=fr.result};fr.readAsDataURL(file);
}
boot();
})();
</script>
